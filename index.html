<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>soars.mp4 — painel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:#000000; --card:#111113; --cardHover:#17171A;
    --texto:#F5F5F5; --cinza:#98989D; --cinzaClaro:#5A5A5E; --inputBg:#0C0C0E;
    --destaque:#FFFFFF; --destaqueTexto:#000000;
    --verde:#32D74B; --laranja:#FF9F0A; --vermelho:#FF453A; --azul:#0A84FF;
    --sombraCard: 0 1px 0 rgba(255,255,255,0.05) inset, 0 12px 32px -16px rgba(0,0,0,0.7);
    --sombraFlutuante: 0 20px 50px -12px rgba(0,0,0,0.7);
    --divisor: rgba(255,255,255,0.08);
  }
  [data-theme="claro"] {
    --bg:#F2F2F5; --card:#FFFFFF; --cardHover:#FBFBFD;
    --texto:#1D1D1F; --cinza:#86868B; --cinzaClaro:#C6C6C9; --inputBg:#F5F5F7;
    --destaque:#1D1D1F; --destaqueTexto:#FFFFFF;
    --verde:#30B350; --laranja:#E6890C; --vermelho:#E0362C; --azul:#0071E3;
    --sombraCard: 0 1px 0 rgba(255,255,255,0.6) inset, 0 12px 32px -18px rgba(0,0,0,0.16);
    --sombraFlutuante: 0 24px 60px -14px rgba(0,0,0,0.22);
    --divisor: rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--texto);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    transition: background .3s, color .3s;
  }
  .num { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
  .heading { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; }
  button { -webkit-tap-highlight-color: transparent; font-family: inherit; }
  button:hover { filter: brightness(1.15); }
  [data-theme="claro"] button:hover { filter: brightness(0.97); }
  input, textarea { font-family: 'Inter', sans-serif; }
  input::placeholder, textarea::placeholder { color: var(--cinzaClaro); }
  input:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--destaque) 30%, transparent); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--divisor); border-radius: 8px; }

  .btn { height:34px; border:none; background:var(--inputBg); border-radius:10px; color:var(--cinza); font-size:11.5px; padding:0 13px; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .btn-dark { background:var(--destaque); color:var(--destaqueTexto); }
  .btn-icon { width:34px; height:34px; border-radius:10px; border:none; background:var(--inputBg); color:var(--texto); font-size:14px; cursor:pointer; display:grid; place-items:center; }
  .card { background:var(--card); border-radius:18px; padding:18px; box-shadow: var(--sombraCard); }
  .dot { display:inline-block; border-radius:50%; flex-shrink:0; }
  .input-field { border:none; background:var(--inputBg); border-radius:10px; padding:11px 13px; font-size:12.5px; outline:none; color:var(--texto); width:100%; }

  #app { padding: 28px 32px 44px; max-width: 1300px; margin: 0 auto; }
  header.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .saved-indicator { display:flex; align-items:center; gap:4px; font-size:9px; color:var(--cinzaClaro); }
  .pulse { width:5px; height:5px; border-radius:50%; background:var(--verde); animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
  .today-label { display:block; color:var(--cinzaClaro); font-size:9.5px; margin-bottom:5px; letter-spacing:.06em; }
  h1.greeting { margin:0; font-size:26px; font-weight:700; letter-spacing:-.03em; }
  .header-actions { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }

  .kpi-grid { display:grid; grid-template-columns:1.15fr 1fr 1fr 1fr; gap:11px; margin-bottom:22px; }
  .kpi { border-radius:18px; padding:17px 18px; box-shadow:var(--sombraCard); }
  .kpi-label { font-size:9.5px; letter-spacing:.04em; display:flex; align-items:center; gap:5px; }
  .kpi-value { display:block; font-size:23px; letter-spacing:-.03em; margin-top:12px; }
  .kpi-sub { font-size:9px; }
  .kpi-destaque { background:var(--destaque); color:var(--destaqueTexto); }
  .kpi-destaque .kpi-label { color: color-mix(in srgb, var(--destaqueTexto) 55%, transparent); }
  .kpi-destaque .kpi-sub { color: color-mix(in srgb, var(--destaqueTexto) 40%, transparent); }
  .kpi-normal { background:var(--card); color:var(--texto); }
  .kpi-normal .kpi-label { color:var(--cinza); }
  .kpi-normal .kpi-sub { color:var(--cinzaClaro); }

  .section-title { margin:0; font-size:12.5px; }
  .section-sub { font-size:9px; color:var(--cinzaClaro); letter-spacing:.04em; }

  .meta-card { margin-bottom:12px; }
  .meta-bar-bg { height:7px; background:var(--inputBg); border-radius:10px; overflow:hidden; }
  .meta-bar-fill { height:100%; border-radius:10px; transition:width .5s cubic-bezier(.16,1,.3,1); background:var(--destaque); }
  .meta-bar-fill.completo { background:var(--verde); }

  .custos-card { margin-bottom:12px; }
  .custos-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .despesa-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:8px 11px; background:var(--inputBg); border-radius:10px; }
  .tarefa-row { display:flex; justify-content:space-between; align-items:center; padding:9px 11px; background:var(--inputBg); border-radius:10px; margin-bottom:6px; }
  .acao-concluir-tarefa:hover { background:var(--verde); border-color:var(--verde); }
  .tarefas-add-row { display:flex; gap:7px; margin-top:12px; }

  .middle-grid { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:11px; margin-bottom:12px; align-items:stretch; }

  .activity-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:190px; gap:8px; color:var(--cinzaClaro); }
  .activity-stats { display:flex; gap:18px; margin-bottom:16px; }
  .activity-chart { height:78px; display:flex; align-items:flex-end; gap:5px; position:relative; }
  .activity-bar-wrap { flex:1; height:100%; display:flex; align-items:flex-end; position:relative; cursor:default; }
  .activity-bar { width:100%; border-radius:5px; transition:height .4s cubic-bezier(.16,1,.3,1), background .2s; background:var(--divisor); }
  .activity-bar.ativo { background:var(--destaque); }
  .activity-tooltip { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px; background:var(--destaque); color:var(--destaqueTexto); font-size:9px; padding:3px 7px; border-radius:6px; white-space:nowrap; font-weight:600; display:none; }
  .activity-bar-wrap:hover .activity-tooltip { display:block; }
  .activity-bar-wrap:hover .activity-bar { background: var(--cinzaClaro); }
  .activity-bar-wrap:hover .activity-bar.ativo { background: var(--destaque); }
  .activity-axis { display:flex; justify-content:space-between; margin-top:9px; font-size:8.5px; color:var(--cinzaClaro); letter-spacing:.02em; }

  .cal-weekdays, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-weekdays { margin-bottom:6px; }
  .cal-weekday { text-align:center; font-size:8.5px; color:var(--cinzaClaro); font-weight:600; }
  .cal-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; font-size:10.5px; font-weight:500; position:relative; }
  .cal-cell.hoje { background:var(--destaque); color:var(--destaqueTexto); font-weight:700; }
  .cal-dots { display:flex; gap:2px; position:absolute; bottom:3px; }
  .cal-dot { width:3.5px; height:3.5px; border-radius:50%; }
  .cal-dot-tarefa { width:3.5px; height:3.5px; border-radius:50%; background:var(--azul); }
  .cal-legend { display:flex; gap:12px; margin-top:12px; font-size:8.5px; color:var(--cinzaClaro); flex-wrap:wrap; }
  .cal-legend span { display:flex; align-items:center; gap:4px; }

  .pagamento-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; }
  .pagamento-avatar { width:25px; height:25px; border-radius:8px; background:var(--inputBg); display:grid; place-items:center; font-size:9.5px; font-weight:700; }

  .clientes-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:11px; }
  .client-card { border-radius:18px; padding:18px; transition:all .25s ease; }
  .client-card:hover { transform:translateY(-3px); box-shadow:var(--sombraFlutuante); background:var(--cardHover); }
  .client-avatar { width:36px; height:36px; border-radius:11px; background:var(--bg); display:grid; place-items:center; font-size:13px; font-weight:700; }
  .client-progress-bg { height:6px; background:var(--inputBg); border-radius:10px; margin-top:13px; overflow:hidden; }
  .client-progress-fill { height:100%; border-radius:10px; transition:width .5s cubic-bezier(.16,1,.3,1); background:var(--destaque); }
  .client-progress-fill.completo { background:var(--verde); }
  .status-pill { padding:3px 9px; border-radius:99px; background:var(--inputBg); font-weight:600; }
  .completo-banner { margin-top:14px; background: color-mix(in srgb, var(--verde) 12%, transparent); border-radius:12px; padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:var(--card); border-radius:18px; padding:22px; width:340px; max-width:90%; box-shadow:var(--sombraFlutuante); }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
  .modal-close { background:transparent; border:none; color:var(--cinza); font-size:15px; cursor:pointer; }

  .toast-host { position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:200; pointer-events:none; }
  .toast { background:var(--card); border-radius:12px; padding:11px 15px; font-size:12px; color:var(--texto); box-shadow:var(--sombraFlutuante); display:flex; align-items:center; gap:8px; min-width:190px; animation:slideIn .25s ease; }
  @keyframes slideIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .hist-group-label { font-size:10px; font-weight:700; color:var(--cinzaClaro); letter-spacing:.08em; margin-bottom:8px; text-transform:uppercase; }
  .hist-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:9px 12px; background:var(--card); border-radius:11px; box-shadow:var(--sombraCard); gap:10px; margin-bottom:6px; }
  .hist-left { display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .hist-mid { flex:1; display:flex; justify-content:center; }
  .hist-note-chip { font-size:10.5px; color:var(--texto); background:var(--inputBg); padding:3px 10px; border-radius:7px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist-date-btn { font-family:'Plus Jakarta Sans',sans-serif; color:var(--cinzaClaro); font-size:10px; flex-shrink:0; background:transparent; border:none; cursor:pointer; padding:2px 4px; border-radius:5px; }
  .note-btn { background:transparent; border:none; cursor:pointer; padding:0; margin-left:3px; display:inline-flex; align-items:center; }

  .conclusao-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:10px 13px; background: color-mix(in srgb, var(--verde) 12%, transparent); border-radius:11px; margin-bottom:6px; }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns:1fr 1fr; }
    .middle-grid { grid-template-columns:1fr; }
  }
  @media (max-width: 560px) {
    #app { padding: 18px; }
    .kpi-grid { grid-template-columns:1fr; }
    .custos-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body data-theme="escuro">
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-host"></div>

<script>
(function () {
  "use strict";

  // ---------- Chaves de armazenamento (localStorage do navegador) ----------
  const K_CLIENTES = "soars-clientes-v3";
  const K_HISTORICO = "soars-historico-v1";
  const K_CONCLUSOES = "soars-conclusoes-v1";
  const K_DESPESAS = "soars-despesas-v1";
  const K_META = "soars-meta-v1";
  const K_TEMA = "soars-tema-v1";
  const K_TAREFAS = "soars-tarefas-v1";

  const SEED_CLIENTES = [
    { id: "caio", nome: "Caio", totalVideos: 30, entregues: 19, valorTotal: 1500, diaPagamento: 10, pago: false, notas: "" },
    { id: "joao", nome: "João", totalVideos: 30, entregues: 0, valorTotal: 1950, diaPagamento: 15, pago: false, notas: "" },
  ];

  // ---------- Estado ----------
  let state = {
    clientes: lerJSON(K_CLIENTES, SEED_CLIENTES),
    historico: lerJSON(K_HISTORICO, []),
    conclusoes: lerJSON(K_CONCLUSOES, []),
    despesas: lerJSON(K_DESPESAS, []),
    tarefas: lerJSON(K_TAREFAS, []),
    meta: Number(localStorage.getItem(K_META)) || 5000,
    tema: localStorage.getItem(K_TEMA) || "escuro",
    ultimoSalvo: new Date().toISOString(),
    verTudoHistorico: false,
    verTudoConclusoes: false,
    confirmarReset: false,
    notaHoverId: null,
    calMes: new Date().getMonth(),
    calAno: new Date().getFullYear(),
  };

  function lerJSON(chave, padrao) {
    try {
      const v = localStorage.getItem(chave);
      return v ? JSON.parse(v) : padrao;
    } catch (e) { return padrao; }
  }
  function salvar(chave, valor) {
    try {
      localStorage.setItem(chave, typeof valor === "string" ? valor : JSON.stringify(valor));
      state.ultimoSalvo = new Date().toISOString();
      return true;
    } catch (e) { return false; }
  }

  // ---------- Utilitários ----------
  function brl(n) { return (n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function fmtDataHora(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " · " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
  function fmtHora(iso) { return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function nomeMes(d) {
    const s = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function diasAteDia(dia) {
    const hoje = new Date();
    let alvo = new Date(hoje.getFullYear(), hoje.getMonth(), dia);
    if (alvo < hoje) alvo = new Date(hoje.getFullYear(), hoje.getMonth() + 1, dia);
    return Math.ceil((alvo - hoje) / 86400000);
  }
  function statusPagamento(cliente) {
  if (cliente.pago) return { cor: "var(--verde)", texto: "pago" };
  const d = diasAteDia(cliente.diaPagamento);
  if (d <= 0) return { cor: "var(--vermelho)", texto: d < 0 ? "atrasado" : "hoje" };
  if (d === 1) return { cor: "var(--laranja)", texto: "amanhã" };
  if (d === 2) return { cor: "var(--azul)", texto: "em 2d" };
  return { cor: "var(--cinza)", texto: "dia " + cliente.diaPagamento };
}
  function iniciais(nome) { return nome.trim().slice(0, 1).toUpperCase(); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function uid() { return Date.now() + "-" + Math.random().toString(36).slice(2, 7); }
  function paraInputDatetime(iso) {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function parseDataBR(texto) {
    const m = texto.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    const dia = Number(m[1]), mes = Number(m[2]), ano = Number(m[3]), hora = Number(m[4]), min = Number(m[5]);
    const d = new Date(ano, mes - 1, dia, hora, min);
    if (d.getFullYear() !== ano || d.getMonth() !== mes - 1 || d.getDate() !== dia) return null;
    return d;
  }

  // ---------- Toasts ----------
  function toast(texto, cor) {
    const host = document.getElementById("toast-root");
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = '<span class="dot" style="width:9px;height:9px;background:' + (cor || "var(--destaque)") + '"></span>' + esc(texto);
    host.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ---------- Modal genérico ----------
  function abrirModal(titulo, corpoHTML, aposMontar) {
    const root = document.getElementById("modal-root");
    root.innerHTML =
      '<div class="modal-overlay" id="modal-overlay">' +
        '<div class="modal-box" id="modal-box">' +
          '<div class="modal-head"><span style="font-size:14px;font-weight:650;">' + esc(titulo) + '</span>' +
          '<button class="modal-close" id="modal-close-btn">✕</button></div>' +
          '<div id="modal-body">' + corpoHTML + '</div>' +
        '</div>' +
      '</div>';
    document.getElementById("modal-overlay").addEventListener("click", (e) => { if (e.target.id === "modal-overlay") fecharModal(); });
    document.getElementById("modal-close-btn").addEventListener("click", fecharModal);
    if (aposMontar) aposMontar();
  }
  function fecharModal() { document.getElementById("modal-root").innerHTML = ""; }

  // ---------- Eventos de histórico / conclusões ----------
  function registrarEvento(ev) {
    ev.id = uid();
    ev.quando = new Date().toISOString();
    ev.nota = ev.nota || "";
    state.historico.unshift(ev);
    state.historico = state.historico.slice(0, 1000);
    salvar(K_HISTORICO, state.historico);
  }
  function registrarConclusao(cliente) {
    state.conclusoes.unshift({ id: uid(), clienteNome: cliente.nome, quantidade: cliente.totalVideos, valor: cliente.valorTotal, quando: new Date().toISOString() });
    state.conclusoes = state.conclusoes.slice(0, 500);
    salvar(K_CONCLUSOES, state.conclusoes);
  }
  function salvarNotaHistorico(id, nota) {
    const ev = state.historico.find((e) => e.id === id);
    if (ev) { ev.nota = nota; salvar(K_HISTORICO, state.historico); }
  }
  function salvarDataHistorico(id, textoData) {
    const d = parseDataBR(textoData);
    if (!d) return false;
    const ev = state.historico.find((e) => e.id === id);
    if (ev) { ev.quando = d.toISOString(); salvar(K_HISTORICO, state.historico); }
    return true;
  }

  // ---------- Ações de cliente ----------
  function encontrarCliente(id) { return state.clientes.find((c) => c.id === id); }
  function salvarClientes() { salvar(K_CLIENTES, state.clientes); }

  function registrarEntrega(id, delta) {
    const c = encontrarCliente(id); if (!c) return;
    const novoValor = Math.max(0, Math.min(c.totalVideos, c.entregues + delta));
    const realDelta = novoValor - c.entregues;
    if (realDelta === 0) return;
    const eraCompleto = c.entregues >= c.totalVideos;
    c.entregues = novoValor;
    salvarClientes();
    registrarEvento({ tipo: "entrega", clienteNome: c.nome, quantidade: realDelta, totalApos: novoValor });
    if (realDelta > 0) toast("+1 vídeo · " + c.nome + " (" + novoValor + "/" + c.totalVideos + ")", "var(--texto)");
    if (!eraCompleto && novoValor === c.totalVideos) {
      toast("🎉 " + c.nome + ": pacote completo!", "var(--verde)");
      registrarConclusao(c);
    }
    render();
  }
  function iniciarNovoPacote(id) {
    const c = encontrarCliente(id); if (!c) return;
    c.entregues = 0; c.pago = false;
    salvarClientes();
    registrarEvento({ tipo: "novo-pacote", clienteNome: c.nome, quantidade: c.totalVideos });
    toast("Novo pacote iniciado · " + c.nome, "var(--texto)");
    render();
  }
  function registrarPagamento(id) {
    const c = encontrarCliente(id); if (!c) return;
    c.pago = !c.pago;
    salvarClientes();
    registrarEvento({ tipo: c.pago ? "pagamento" : "pagamento-desfeito", clienteNome: c.nome, valor: c.valorTotal });
    if (c.pago) toast("Pagamento de " + c.nome + " recebido", "var(--verde)");
    render();
  }
  function removerCliente(id) {
    const c = encontrarCliente(id);
    state.clientes = state.clientes.filter((x) => x.id !== id);
    salvarClientes();
    if (c) { registrarEvento({ tipo: "remocao", clienteNome: c.nome }); toast(c.nome + " removido", "var(--vermelho)"); }
    render();
  }
  function editarCliente(id, dados) {
    const c = encontrarCliente(id); if (!c) return;
    const nomeAntigo = c.nome;
    Object.assign(c, dados);
    salvarClientes();
    if (nomeAntigo !== dados.nome) registrarEvento({ tipo: "edicao", clienteNome: dados.nome, detalhe: "renomeado de " + nomeAntigo });
    toast(dados.nome + " atualizado", "var(--texto)");
    render();
  }
  function adicionarCliente(dados) {
    const c = { id: dados.nome.toLowerCase().replace(/\s+/g, "-") + "-" + Date.now(), nome: dados.nome.trim(), totalVideos: dados.totalVideos, entregues: 0, valorTotal: dados.valorTotal, diaPagamento: dados.diaPagamento, pago: false, notas: "" };
    state.clientes.push(c);
    salvarClientes();
    registrarEvento({ tipo: "novo-cliente", clienteNome: c.nome });
    toast(c.nome + " adicionado", "var(--texto)");
    render();
  }

  // ---------- Despesas ----------
  function adicionarDespesa(dados) {
    const d = { id: uid(), nome: dados.nome.trim(), valor: dados.valor, categoria: dados.categoria.trim() || "geral", quando: new Date().toISOString() };
    state.despesas.unshift(d);
    salvar(K_DESPESAS, state.despesas);
    toast('Despesa "' + d.nome + '" adicionada', "var(--vermelho)");
    render();
  }
  function removerDespesa(id) {
    state.despesas = state.despesas.filter((d) => d.id !== id);
    salvar(K_DESPESAS, state.despesas);
    render();
  }

  // ---------- Tarefas ----------
  function adicionarTarefa(texto, prazoTexto) {
    if (!texto.trim()) return;
    let prazoISO = null;
    if (prazoTexto && prazoTexto.trim()) {
      const m = prazoTexto.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) {
        const dia = Number(m[1]), mes = Number(m[2]), ano = Number(m[3]);
        const d = new Date(ano, mes - 1, dia);
        if (d.getFullYear() === ano && d.getMonth() === mes - 1 && d.getDate() === dia) prazoISO = d.toISOString();
      }
    }
    state.tarefas.push({ id: uid(), texto: texto.trim(), prazo: prazoISO, criadaEm: new Date().toISOString() });
    salvar(K_TAREFAS, state.tarefas);
    render();
  }
  function concluirTarefa(id) {
    state.tarefas = state.tarefas.filter((t) => t.id !== id);
    salvar(K_TAREFAS, state.tarefas);
    toast("Tarefa concluída", "var(--verde)");
    render();
  }
  function diasAtePrazo(prazoISO) {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const alvo = new Date(prazoISO); alvo.setHours(0, 0, 0, 0);
    return Math.round((alvo - hoje) / 86400000);
  }
  function statusTarefa(t) {
  if (!t.prazo) return { cor: "var(--cinzaClaro)", texto: "" };
  const d = diasAtePrazo(t.prazo);
  if (d <= 0) return { cor: "var(--vermelho)", texto: d < 0 ? "atrasada" : "hoje" };
  if (d === 1) return { cor: "var(--laranja)", texto: "amanhã" };
  if (d === 2) return { cor: "var(--azul)", texto: "em 2d" };
  return { cor: "var(--cinza)", texto: new Date(t.prazo).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) };
}

  // ---------- Meta ----------
  function salvarMeta(valor) {
    state.meta = valor;
    salvar(K_META, String(valor));
    render();
  }

  // ---------- Tema ----------
  function alternarTema() {
    state.tema = state.tema === "escuro" ? "claro" : "escuro";
    localStorage.setItem(K_TEMA, state.tema);
    document.body.setAttribute("data-theme", state.tema);
    render();
  }

  // ---------- Reset ----------
  function resetarTudo() {
    localStorage.removeItem(K_CLIENTES);
    localStorage.removeItem(K_HISTORICO);
    localStorage.removeItem(K_CONCLUSOES);
    localStorage.removeItem(K_DESPESAS);
    localStorage.removeItem(K_META);
    localStorage.removeItem(K_TAREFAS);
    state.clientes = []; state.historico = []; state.conclusoes = []; state.despesas = []; state.tarefas = []; state.meta = 5000;
    state.confirmarReset = false;
    toast("Painel resetado", "var(--vermelho)");
    render();
  }

  // ---------- Backup / Relatório ----------
  function baixarArquivo(nome, conteudo, tipo) {
    const blob = new Blob([conteudo], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function baixarBackup() {
    const dados = { clientes: state.clientes, historico: state.historico, conclusoes: state.conclusoes, despesas: state.despesas, tarefas: state.tarefas, meta: state.meta, tema: state.tema, versao: 1, exportadoEm: new Date().toISOString() };
    baixarArquivo("backup-soars-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(dados, null, 2), "application/json");
    toast("Backup baixado", "var(--texto)");
  }
  function importarBackup(arquivo) {
    const leitor = new FileReader();
    leitor.onload = (ev) => {
      try {
        const dados = JSON.parse(ev.target.result);
        if (dados.clientes) { state.clientes = dados.clientes; salvar(K_CLIENTES, state.clientes); }
        if (dados.historico) { state.historico = dados.historico; salvar(K_HISTORICO, state.historico); }
        if (dados.conclusoes) { state.conclusoes = dados.conclusoes; salvar(K_CONCLUSOES, state.conclusoes); }
        if (dados.despesas) { state.despesas = dados.despesas; salvar(K_DESPESAS, state.despesas); }
        if (dados.tarefas) { state.tarefas = dados.tarefas; salvar(K_TAREFAS, state.tarefas); }
        if (typeof dados.meta === "number") { state.meta = dados.meta; salvar(K_META, String(dados.meta)); }
        toast("Backup importado com sucesso", "var(--verde)");
        render();
      } catch (e) { toast("Arquivo inválido — não foi possível importar", "var(--vermelho)"); }
    };
    leitor.readAsText(arquivo);
  }
  function exportarRelatorio() {
    const receitaMensal = state.clientes.reduce((s, c) => s + c.valorTotal, 0);
    const recebido = state.clientes.filter((c) => c.pago).reduce((s, c) => s + c.valorTotal, 0);
    const aReceber = receitaMensal - recebido;
    const totalDespesas = state.despesas.reduce((s, d) => s + d.valor, 0);
    const lucroLiquido = receitaMensal - totalDespesas;
    const totalEntregues = state.clientes.reduce((s, c) => s + c.entregues, 0);
    const totalVideos = state.clientes.reduce((s, c) => s + c.totalVideos, 0);
    const hoje = new Date().toLocaleDateString("pt-BR");
    let txt = "RELATÓRIO — soars.mp4\nGerado em " + hoje + "\n\n";
    txt += "Receita mensal: " + brl(receitaMensal) + "\nDespesas: " + brl(totalDespesas) + "\nLucro líquido: " + brl(lucroLiquido) + "\nRecebido: " + brl(recebido) + "\nA receber: " + brl(aReceber) + "\nProdução: " + totalEntregues + "/" + totalVideos + " vídeos\n\n";
    txt += "CLIENTES\n";
    state.clientes.forEach((c) => {
      txt += "- " + c.nome + ": " + c.entregues + "/" + c.totalVideos + " vídeos · " + brl(c.valorTotal) + " · dia " + c.diaPagamento + " · " + (c.pago ? "pago" : "pendente") + "\n";
      if (c.notas) txt += "  obs: " + c.notas + "\n";
    });
    txt += "\nPACOTES CONCLUÍDOS\n";
    state.conclusoes.slice(0, 30).forEach((cn) => { txt += "- " + fmtDataHora(cn.quando) + " · " + cn.clienteNome + " · " + cn.quantidade + " vídeos · " + brl(cn.valor) + "\n"; });
    txt += "\nHISTÓRICO RECENTE\n";
    state.historico.slice(0, 30).forEach((ev) => { txt += "- " + fmtDataHora(ev.quando) + " · " + ev.clienteNome + " · " + ev.tipo + (ev.quantidade ? " (" + (ev.quantidade > 0 ? "+" : "") + ev.quantidade + ")" : "") + "\n"; });
    baixarArquivo("relatorio-soars-" + hoje.replace(/\//g, "-") + ".txt", txt, "text/plain;charset=utf-8");
    toast("Relatório exportado", "var(--texto)");
  }

  // ---------- Renderização ----------
  function iconeLapis(preenchido) {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="' + (preenchido ? "var(--destaque)" : "var(--cinzaClaro)") + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  }

  function renderAtividade() {
    const hist = state.historico;
    const dias = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); dias.push(d); }
    const contagem = dias.map((d) => {
      const chave = d.toDateString();
      return hist.filter((ev) => ev.tipo === "entrega" && new Date(ev.quando).toDateString() === chave).reduce((s, ev) => s + Math.max(ev.quantidade, 0), 0);
    });
    const totalPeriodo = contagem.reduce((a, b) => a + b, 0);
    if (totalPeriodo === 0) {
      return '<div class="activity-empty"><div style="display:flex;gap:4px;">' +
        [0, 1, 2].map(() => '<span style="width:6px;height:6px;border-radius:50%;background:var(--cinzaClaro);"></span>').join("") +
        '</div><span style="font-size:11.5px;text-align:center;">Sem vídeos registrados<br>nos últimos 14 dias</span></div>';
    }
    const hoje7 = contagem.slice(-7).reduce((a, b) => a + b, 0);
    let streak = 0;
    for (let i = contagem.length - 1; i >= 0; i--) { if (contagem[i] > 0) streak++; else break; }
    const max = Math.max(...contagem, 1);
    let html = '<div class="activity-stats">';
    html += '<div><strong class="num" style="display:block;font-size:20px;">' + hoje7 + '</strong><span style="font-size:9px;color:var(--cinzaClaro);">últimos 7 dias</span></div>';
    html += '<div><strong class="num" style="display:block;font-size:20px;">' + streak + '</strong><span style="font-size:9px;color:var(--cinzaClaro);">dia' + (streak !== 1 ? "s" : "") + ' seguido' + (streak !== 1 ? "s" : "") + '</span></div>';
    html += '</div><div class="activity-chart">';
    contagem.forEach((v, i) => {
      const ativo = i === contagem.length - 1;
      const altura = Math.max((v / max) * 100, 6);
      html += '<div class="activity-bar-wrap"><div class="activity-tooltip">' + v + " vídeo" + (v !== 1 ? "s" : "") + '</div><div class="activity-bar' + (ativo ? " ativo" : "") + '" style="height:' + altura + '%"></div></div>';
    });
    html += '</div><div class="activity-axis"><span>' + dias[0].toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + '</span><span style="color:var(--texto);font-weight:600;">HOJE</span></div>';
    return html;
  }

  function renderCalendario() {
    const hoje = new Date();
    const ano = state.calAno, mes = state.calMes;
    const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
    const totalDias = new Date(ano, mes + 1, 0).getDate();
    const diasComEntrega = new Set(
      state.historico.filter((ev) => ev.tipo === "entrega" && ev.quantidade > 0)
        .map((ev) => new Date(ev.quando)).filter((d) => d.getFullYear() === ano && d.getMonth() === mes).map((d) => d.getDate())
    );
    const pagamentosPorDia = {};
    state.clientes.forEach((c) => { (pagamentosPorDia[c.diaPagamento] = pagamentosPorDia[c.diaPagamento] || []).push(c); });
    const tarefasPorDia = {};
    state.tarefas.forEach((t) => {
      if (!t.prazo) return;
      const d = new Date(t.prazo);
      if (d.getFullYear() === ano && d.getMonth() === mes) (tarefasPorDia[d.getDate()] = tarefasPorDia[d.getDate()] || []).push(t);
    });

    let html = '<div class="cal-weekdays">' + ["D", "S", "T", "Q", "Q", "S", "S"].map((d) => '<div class="cal-weekday">' + d + '</div>').join("") + '</div>';
    html += '<div class="cal-grid">';
    for (let i = 0; i < primeiroDiaSemana; i++) html += '<div></div>';
    for (let d = 1; d <= totalDias; d++) {
      const ehHoje = d === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear();
      const pagamentos = pagamentosPorDia[d];
      const teveEntrega = diasComEntrega.has(d);
      const tarefasDoDia = tarefasPorDia[d];
      let corPagamento = null;
      if (pagamentos) corPagamento = pagamentos.some((c) => !c.pago) ? "var(--laranja)" : "var(--verde)";
      let dots = "";
      if (corPagamento) dots += '<span class="cal-dot" style="background:' + (ehHoje ? "var(--destaqueTexto)" : corPagamento) + '"></span>';
      if (teveEntrega) dots += '<span class="cal-dot" style="background:' + (ehHoje ? "var(--destaqueTexto)" : "var(--cinzaClaro)") + '"></span>';
      if (tarefasDoDia) dots += '<span class="cal-dot-tarefa" style="background:' + (ehHoje ? "var(--destaqueTexto)" : "var(--azul)") + '"></span>';
      const titulo = tarefasDoDia ? tarefasDoDia.map((t) => t.texto).join(", ") : "";
      html += '<div class="cal-cell' + (ehHoje ? " hoje" : "") + '"' + (titulo ? ' title="' + esc(titulo) + '"' : '') + '>' + d + '<div class="cal-dots">' + dots + '</div></div>';
    }
    html += '</div>';
    html += '<div class="cal-legend"><span><span class="cal-dot" style="background:var(--laranja);width:5px;height:5px;"></span> pagamento pendente</span>' +
            '<span><span class="cal-dot" style="background:var(--cinzaClaro);width:5px;height:5px;"></span> entrega registrada</span>' +
            '<span><span class="cal-dot-tarefa"></span> tarefa com prazo</span></div>';
    return html;
  }

  function renderPagamentos() {
    const lista = [...state.clientes].sort((a, b) => diasAteDia(a.diaPagamento) - diasAteDia(b.diaPagamento));
    if (lista.length === 0) return '<span style="font-size:10px;color:var(--cinzaClaro);">nenhum cliente ainda.</span>';
    return lista.map((c) => {
      const st = statusPagamento(c);
      return '<div class="pagamento-row"><div style="display:flex;gap:8px;align-items:center;">' +
        '<div class="pagamento-avatar num">' + esc(iniciais(c.nome)) + '</div>' +
        '<div><b style="font-size:10.5px;">' + esc(c.nome) + '</b><small style="display:block;color:' + st.cor + ';font-size:8.5px;font-weight:600;">' + st.texto + '</small></div></div>' +
        '<span class="num" style="font-size:10.5px;font-weight:600;">' + brl(c.valorTotal) + '</span></div>';
    }).join("");
  }

  function renderClienteCard(c) {
    const pct = Math.round((c.entregues / c.totalVideos) * 100) || 0;
    const completo = c.entregues >= c.totalVideos;
    const valorUnidade = c.valorTotal / c.totalVideos;
    const status = statusPagamento(c);
    let html = '<article class="card client-card" data-client-id="' + esc(c.id) + '">';
    html += '<div style="display:flex;align-items:center;gap:11px;">';
    html += '<div class="client-avatar num">' + esc(iniciais(c.nome)) + '</div>';
    html += '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px;">' +
      '<span class="dot" style="width:7px;height:7px;background:' + status.cor + ';"></span>' + esc(c.nome) + '</div>' +
      '<div style="font-size:10.5px;color:var(--cinzaClaro);margin-top:2px;">' + c.totalVideos + ' vídeos · ' + brl(valorUnidade) + '/vídeo</div></div>';
    html += '<button class="acao-editar-cliente" data-id="' + esc(c.id) + '" style="background:transparent;border:none;color:var(--cinzaClaro);font-size:17px;cursor:pointer;">⋯</button>';
    html += '</div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;margin-top:16px;">' +
      '<div><label style="font-size:9px;color:var(--cinzaClaro);display:block;margin-bottom:3px;letter-spacing:.04em;">ENTREGUES</label>' +
      '<strong class="num" style="font-size:17px;">' + c.entregues + ' <small style="color:var(--cinzaClaro);font-size:10px;font-weight:400;">/ ' + c.totalVideos + '</small></strong></div>' +
      '<div style="text-align:right;"><label style="font-size:9px;color:var(--cinzaClaro);display:block;margin-bottom:3px;letter-spacing:.04em;">CONTRATO</label>' +
      '<strong class="num" style="font-size:15px;">' + brl(c.valorTotal) + '</strong></div></div>';

    html += '<div class="client-progress-bg"><div class="client-progress-fill' + (pct >= 100 ? " completo" : "") + '" style="width:' + Math.min(pct, 100) + '%"></div></div>';
    html += '<div style="display:flex;justify-content:space-between;margin-top:9px;font-size:9.5px;color:var(--cinza);">' +
      '<span>' + pct + '% concluído</span><span class="status-pill" style="color:' + status.cor + ';">' + status.texto + '</span></div>';

    if (completo) {
      html += '<div class="completo-banner"><span style="font-size:11px;color:var(--verde);font-weight:600;">🎉 pacote concluído</span>' +
        '<button class="btn btn-dark acao-novo-pacote" data-id="' + esc(c.id) + '" style="height:30px;font-size:10.5px;">iniciar novo pacote</button></div>';
    } else {
      html += '<div style="display:flex;gap:6px;margin-top:14px;">' +
        '<button class="btn acao-entrega" data-id="' + esc(c.id) + '" data-delta="-1">−</button>' +
        '<button class="btn btn-dark acao-entrega" data-id="' + esc(c.id) + '" data-delta="1" style="flex:1;">Registrar vídeo</button></div>';
    }
    html += '<div style="display:flex;gap:6px;margin-top:8px;"><button class="btn acao-pagamento" data-id="' + esc(c.id) + '" style="flex:1;color:' + (c.pago ? "var(--verde)" : "var(--cinza)") + ';">' + (c.pago ? "recebido ✓" : "marcar pago") + '</button></div>';

    if (c.notas) {
      html += '<div style="margin-top:12px;"><button class="acao-toggle-notas" data-id="' + esc(c.id) + '" style="background:transparent;border:none;color:var(--texto);font-size:9.5px;cursor:pointer;padding:0;font-weight:600;">ver observações ✎</button>' +
        '<div class="notas-conteudo" data-id="' + esc(c.id) + '" style="display:none;font-size:11px;color:var(--cinza);margin-top:7px;background:var(--inputBg);padding:10px 12px;border-radius:10px;line-height:1.5;">' + esc(c.notas) + '</div></div>';
    }
    html += '</article>';
    return html;
  }

  function renderHistoricoAgrupado() {
    const lista = state.verTudoHistorico ? state.historico : state.historico.slice(0, 12);
    if (lista.length === 0) return '<div style="font-size:11px;color:var(--cinzaClaro);">nenhum evento ainda.</div>';
    const grupos = [];
    lista.forEach((ev) => {
      const d = new Date(ev.quando);
      const chave = d.getFullYear() + "-" + d.getMonth();
      let g = grupos.find((x) => x.chave === chave);
      if (!g) { g = { chave, label: nomeMes(d), itens: [] }; grupos.push(g); }
      g.itens.push(ev);
    });
    return grupos.map((g) => {
      let html = '<div style="margin-bottom:18px;"><div class="hist-group-label">' + esc(g.label) + '</div>';
      g.itens.forEach((ev) => {
        const cor = ev.tipo === "pagamento" ? "var(--verde)" : (ev.tipo === "pagamento-desfeito" || ev.tipo === "remocao") ? "var(--vermelho)" : (ev.tipo === "novo-cliente" || ev.tipo === "novo-pacote") ? "var(--laranja)" : ev.quantidade > 0 ? "var(--texto)" : "var(--laranja)";
        let desc = "";
        if (ev.tipo === "entrega") desc = " · " + (ev.quantidade > 0 ? "+" : "") + ev.quantidade + " vídeo (total " + ev.totalApos + ")";
        else if (ev.tipo === "pagamento") desc = " · pagamento recebido (" + brl(ev.valor) + ")";
        else if (ev.tipo === "pagamento-desfeito") desc = " · pagamento desmarcado";
        else if (ev.tipo === "novo-cliente") desc = " · cliente adicionado";
        else if (ev.tipo === "novo-pacote") desc = " · novo pacote iniciado (" + ev.quantidade + " vídeos)";
        else if (ev.tipo === "remocao") desc = " · cliente removido";
        else if (ev.tipo === "edicao") desc = " · " + esc(ev.detalhe);

        html += '<div class="hist-row"><span class="hist-left"><span class="dot" style="width:6px;height:6px;background:' + cor + ';"></span><b>' + esc(ev.clienteNome) + '</b>' + desc;
        if (ev.tipo === "entrega") {
          html += '<button class="note-btn acao-nota" data-id="' + esc(ev.id) + '" data-nota="' + esc(ev.nota || "") + '">' + iconeLapis(!!ev.nota) + '</button>';
        }
        html += '</span><span class="hist-mid">';
        if (state.notaHoverId === ev.id && ev.nota) html += '<span class="hist-note-chip">' + esc(ev.nota) + '</span>';
        html += '</span>';
        html += '<button class="hist-date-btn acao-data" data-id="' + esc(ev.id) + '" data-quando="' + esc(ev.quando) + '">' + fmtDataHora(ev.quando) + '</button></div>';
      });
      html += '</div>';
      return html;
    }).join("");
  }

  function renderConclusoes() {
    if (state.conclusoes.length === 0) return '<div style="font-size:11px;color:var(--cinzaClaro);">nenhum pacote concluído ainda — quando um cliente bater 100% de entregas, ele aparece aqui.</div>';
    const lista = state.conclusoes.slice(0, state.verTudoConclusoes ? state.conclusoes.length : 6);
    return lista.map((cn) =>
      '<div class="conclusao-row"><span style="display:flex;gap:8px;align-items:center;"><span class="dot" style="width:7px;height:7px;background:var(--verde);"></span><b>' + esc(cn.clienteNome) + '</b> · pacote de ' + cn.quantidade + ' vídeos concluído</span>' +
      '<span style="display:flex;align-items:center;gap:10px;"><span class="num" style="font-weight:600;color:var(--verde);">' + brl(cn.valor) + '</span>' +
      '<span class="num" style="color:var(--cinzaClaro);font-size:10px;">' + fmtDataHora(cn.quando) + '</span></span></div>'
    ).join("");
  }

  function renderTarefas() {
    if (state.tarefas.length === 0) return '<div style="font-size:11px;color:var(--cinzaClaro);">nenhuma tarefa pendente — as que você adicionar aparecem aqui até você concluir.</div>';
    const lista = [...state.tarefas].sort((a, b) => {
      if (!a.prazo && !b.prazo) return 0;
      if (!a.prazo) return 1;
      if (!b.prazo) return -1;
      return new Date(a.prazo) - new Date(b.prazo);
    });
    return lista.map((t) => {
      const st = statusTarefa(t);
      return '<div class="tarefa-row"><div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
        '<button class="acao-concluir-tarefa" data-id="' + esc(t.id) + '" title="Marcar como concluída" style="width:20px;height:20px;border-radius:50%;border:2px solid var(--cinzaClaro);background:transparent;cursor:pointer;flex-shrink:0;"></button>' +
        '<span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(t.texto) + '</span></div>' +
        (st.texto ? '<span class="status-pill num" style="color:' + st.cor + ';flex-shrink:0;margin-left:8px;font-size:9.5px;">' + st.texto + '</span>' : '') +
        '</div>';
    }).join("");
  }

  function renderDespesas() {
    if (state.despesas.length === 0) return "";
    return state.despesas.map((d) =>
      '<div class="despesa-row"><span style="display:flex;gap:8px;align-items:center;"><span class="dot" style="width:6px;height:6px;background:var(--vermelho);"></span><b>' + esc(d.nome) + '</b>' +
      '<span style="color:var(--cinzaClaro);font-size:9.5px;padding:2px 7px;border-radius:99px;background:var(--card);">' + esc(d.categoria) + '</span></span>' +
      '<span style="display:flex;align-items:center;gap:10px;"><span class="num" style="font-weight:600;color:var(--vermelho);">' + brl(d.valor) + '</span>' +
      '<button class="acao-remover-despesa" data-id="' + esc(d.id) + '" style="background:transparent;border:none;color:var(--cinzaClaro);font-size:13px;cursor:pointer;">✕</button></span></div>'
    ).join("");
  }

  function render() {
    document.body.setAttribute("data-theme", state.tema);

    const receitaMensal = state.clientes.reduce((s, c) => s + c.valorTotal, 0);
    const totalEntregues = state.clientes.reduce((s, c) => s + c.entregues, 0);
    const totalVideos = state.clientes.reduce((s, c) => s + c.totalVideos, 0);
    const recebido = state.clientes.filter((c) => c.pago).reduce((s, c) => s + c.valorTotal, 0);
    const aReceber = receitaMensal - recebido;
    const metaPct = state.meta > 0 ? Math.min(Math.round((receitaMensal / state.meta) * 100), 100) : 0;
    const totalDespesas = state.despesas.reduce((s, d) => s + d.valor, 0);
    const lucroLiquido = receitaMensal - totalDespesas;
    const hojeStr = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" }).toUpperCase();
    const pendentes = state.clientes.filter((c) => !c.pago).length;

    let html = "";

    // Header
    html += '<header class="top"><div>';
    html += '<div class="brand-row"><span class="num" style="font-size:13px;font-weight:700;letter-spacing:-.02em;">soars<span style="color:var(--cinzaClaro);">.mp4</span></span>';
    if (state.ultimoSalvo) html += '<span class="saved-indicator"><span class="pulse"></span>salvo às ' + fmtHora(state.ultimoSalvo) + '</span>';
    html += '</div>';
    html += '<small class="today-label">' + hojeStr + '</small>';
    html += '<h1 class="heading greeting">Olá, Luan.</h1></div>';
    html += '<div class="header-actions">';
    html += '<button class="btn-icon" id="btn-tema">' + (state.tema === "escuro" ? "☀︎" : "☾") + '</button>';
    if (!state.confirmarReset) {
      html += '<button class="btn" id="btn-reset">Resetar</button>';
    } else {
      html += '<span style="font-size:10px;color:var(--vermelho);">apagar tudo?</span>';
      html += '<button class="btn" id="btn-confirmar-reset" style="color:var(--vermelho);">confirmar</button>';
      html += '<button class="btn" id="btn-cancelar-reset">cancelar</button>';
    }
    html += '<button class="btn" id="btn-relatorio">Relatório</button>';
    html += '<button class="btn" id="btn-backup" title="Baixa um arquivo .json com todos os seus dados">Backup</button>';
    html += '<label class="btn" style="cursor:pointer;" title="Restaura os dados a partir de um backup .json">Importar<input type="file" id="input-importar" accept="application/json" style="display:none;"></label>';
    html += '<button class="btn btn-dark" id="btn-novo-cliente">+ Novo cliente</button>';
    html += '</div></header>';

    // KPIs
    html += '<section class="kpi-grid">';
    html += '<div class="kpi kpi-destaque"><div class="kpi-label">RECEITA MENSAL</div><strong class="num kpi-value">' + brl(receitaMensal) + '</strong><span class="kpi-sub">' + state.clientes.length + ' contrato' + (state.clientes.length !== 1 ? "s" : "") + ' ativo' + (state.clientes.length !== 1 ? "s" : "") + '</span></div>';
    html += '<div class="kpi kpi-normal"><div class="kpi-label"><span class="dot" style="width:6px;height:6px;background:var(--verde);"></span>RECEBIDO</div><strong class="num kpi-value" style="color:var(--verde);">' + brl(recebido) + '</strong><span class="kpi-sub">' + (receitaMensal > 0 ? Math.round((recebido / receitaMensal) * 100) : 0) + '% do total</span></div>';
    html += '<div class="kpi kpi-normal"><div class="kpi-label"><span class="dot" style="width:6px;height:6px;background:var(--laranja);"></span>A RECEBER</div><strong class="num kpi-value" style="color:var(--laranja);">' + brl(aReceber) + '</strong><span class="kpi-sub">' + pendentes + ' pagamento' + (pendentes !== 1 ? "s" : "") + '</span></div>';
    html += '<div class="kpi kpi-normal"><div class="kpi-label">PRODUÇÃO</div><strong class="num kpi-value">' + totalEntregues + '/' + totalVideos + '</strong><span class="kpi-sub">' + (totalVideos > 0 ? Math.round((totalEntregues / totalVideos) * 100) : 0) + '% concluído</span></div>';
    html += '</section>';

    // Tarefas
    html += '<section class="card" style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
      '<h2 class="heading section-title">Tarefas</h2><span class="section-sub">' + state.tarefas.length + ' pendente' + (state.tarefas.length !== 1 ? "s" : "") + '</span></div>';
    html += renderTarefas();
    html += '<div class="tarefas-add-row">' +
      '<input class="input-field" id="tarefa-texto" placeholder="o que você precisa fazer?" style="flex:2;">' +
      '<input class="input-field" id="tarefa-prazo" placeholder="prazo (opcional) DD/MM/AAAA" style="flex:1;">' +
      '<button class="btn btn-dark" id="tarefa-add">+</button></div></section>';

    // Meta
    html += '<section class="card meta-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
      '<span style="font-size:12px;font-weight:600;">Meta mensal</span>' +
      '<button id="btn-editar-meta" style="background:transparent;border:none;font-size:10px;color:var(--cinza);cursor:pointer;font-weight:600;">editar meta (' + brl(state.meta) + ')</button></div>' +
      '<div class="meta-bar-bg"><div class="meta-bar-fill' + (metaPct >= 100 ? " completo" : "") + '" style="width:' + metaPct + '%"></div></div>' +
      '<div class="num" style="font-size:9.5px;color:var(--cinzaClaro);margin-top:7px;">' + brl(receitaMensal) + ' de ' + brl(state.meta) + ' · ' + metaPct + '%</div></section>';

    // Custos mensais
    html += '<section class="card custos-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
      '<div><h2 class="heading section-title">Custos mensais</h2><span style="font-size:9.5px;color:var(--cinzaClaro);">lucro líquido: <b class="num" style="color:' + (lucroLiquido >= 0 ? "var(--verde)" : "var(--vermelho)") + ';">' + brl(lucroLiquido) + '</b></span></div>' +
      '<button class="btn btn-dark" id="btn-nova-despesa">+ Despesa</button></div>';
    html += '<div class="custos-grid" style="margin-bottom:' + (state.despesas.length > 0 ? "14px" : "0") + ';">' +
      '<div><div style="font-size:9px;color:var(--cinzaClaro);">RECEITA</div><strong class="num" style="font-size:15px;">' + brl(receitaMensal) + '</strong></div>' +
      '<div><div style="font-size:9px;color:var(--cinzaClaro);">DESPESAS</div><strong class="num" style="font-size:15px;color:var(--vermelho);">' + brl(totalDespesas) + '</strong></div>' +
      '<div><div style="font-size:9px;color:var(--cinzaClaro);">LÍQUIDO</div><strong class="num" style="font-size:15px;color:' + (lucroLiquido >= 0 ? "var(--verde)" : "var(--vermelho)") + ';">' + brl(lucroLiquido) + '</strong></div></div>';
    html += renderDespesas();
    html += '</section>';

    // Atividade / Calendário / Pagamentos
    html += '<section class="middle-grid">';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:14px;"><h2 class="heading section-title">Atividade</h2><span class="section-sub">14 DIAS</span></div>' + renderAtividade() + '</div>';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 class="heading section-title">Calendário</h2>' +
      '<div style="display:flex;align-items:center;gap:6px;">' +
      '<button class="btn-icon" id="cal-mes-anterior" style="width:22px;height:22px;font-size:11px;">‹</button>' +
      '<span class="section-sub" style="min-width:90px;text-align:center;">' + nomeMes(new Date(state.calAno, state.calMes, 1)).toUpperCase() + '</span>' +
      '<button class="btn-icon" id="cal-mes-proximo" style="width:22px;height:22px;font-size:11px;">›</button>' +
      '</div></div>' + renderCalendario() + '</div>';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h2 class="heading section-title">Pagamentos</h2><span class="section-sub">PRÓXIMOS</span></div><div>' + renderPagamentos() + '</div></div>';
    html += '</section>';

    // Clientes
    html += '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:26px 0 13px;">' +
      '<div><h2 class="heading" style="margin:0;font-size:15px;">Clientes</h2><p style="margin:4px 0 0;color:var(--cinzaClaro);font-size:9.5px;">Produção, pagamentos e observações.</p></div></div>';
    html += '<div class="clientes-grid">' + state.clientes.map(renderClienteCard).join("") + '</div>';
    if (state.clientes.length === 0) html += '<div style="text-align:center;color:var(--cinzaClaro);padding:24px 0;font-size:12px;">nenhum cliente — adicione um pelo botão acima.</div>';

    // Pacotes concluídos
    html += '<div style="margin-top:30px;"><h2 class="heading" style="margin:0 0 12px;font-size:14px;">Pacotes concluídos</h2>' + renderConclusoes() + '</div>';

    // Histórico
    html += '<div style="margin-top:30px;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;">' +
      '<h2 class="heading" style="margin:0;font-size:14px;">Histórico</h2>';
    if (state.historico.length > 12) html += '<button id="btn-ver-tudo-historico" style="background:transparent;border:none;color:var(--cinzaClaro);font-size:10px;cursor:pointer;">' + (state.verTudoHistorico ? "ver menos" : "ver tudo (" + state.historico.length + ")") + '</button>';
    html += '</div>' + renderHistoricoAgrupado() + '</div>';

    document.getElementById("app").innerHTML = html;
    ligarEventosApp();
  }

  // ---------- Ligação de eventos (delegação) ----------
  function ligarEventosApp() {
    const app = document.getElementById("app");

    const on = (sel, evento, fn) => { app.querySelectorAll(sel).forEach((el) => el.addEventListener(evento, fn)); };

    on("#btn-tema", "click", alternarTema);
    on("#btn-reset", "click", () => { state.confirmarReset = true; render(); });
    on("#btn-confirmar-reset", "click", resetarTudo);
    on("#btn-cancelar-reset", "click", () => { state.confirmarReset = false; render(); });
    on("#btn-relatorio", "click", exportarRelatorio);
    on("#btn-backup", "click", baixarBackup);
    on("#input-importar", "change", (e) => { if (e.target.files[0]) importarBackup(e.target.files[0]); });
    on("#btn-novo-cliente", "click", abrirModalNovoCliente);
    on("#btn-editar-meta", "click", abrirModalMeta);
    on("#btn-nova-despesa", "click", abrirModalDespesa);
    on("#btn-ver-tudo-historico", "click", () => { state.verTudoHistorico = !state.verTudoHistorico; render(); });

    const addTarefaFn = () => {
      const texto = document.getElementById("tarefa-texto").value;
      const prazo = document.getElementById("tarefa-prazo").value;
      if (!texto.trim()) return;
      adicionarTarefa(texto, prazo);
    };
    on("#tarefa-add", "click", addTarefaFn);
    on("#tarefa-texto", "keydown", (e) => { if (e.key === "Enter") addTarefaFn(); });
    on("#tarefa-prazo", "keydown", (e) => { if (e.key === "Enter") addTarefaFn(); });
    on(".acao-concluir-tarefa", "click", (e) => concluirTarefa(e.currentTarget.dataset.id));
    on("#cal-mes-anterior", "click", () => { state.calMes--; if (state.calMes < 0) { state.calMes = 11; state.calAno--; } render(); });
    on("#cal-mes-proximo", "click", () => { state.calMes++; if (state.calMes > 11) { state.calMes = 0; state.calAno++; } render(); });

    on(".acao-entrega", "click", (e) => registrarEntrega(e.currentTarget.dataset.id, Number(e.currentTarget.dataset.delta)));
    on(".acao-novo-pacote", "click", (e) => iniciarNovoPacote(e.currentTarget.dataset.id));
    on(".acao-pagamento", "click", (e) => registrarPagamento(e.currentTarget.dataset.id));
    on(".acao-editar-cliente", "click", (e) => abrirModalEditarCliente(e.currentTarget.dataset.id));
    on(".acao-remover-despesa", "click", (e) => removerDespesa(e.currentTarget.dataset.id));
    on(".acao-toggle-notas", "click", (e) => {
      const id = e.currentTarget.dataset.id;
      const conteudo = app.querySelector('.notas-conteudo[data-id="' + CSS.escape(id) + '"]');
      const visivel = conteudo.style.display !== "none";
      conteudo.style.display = visivel ? "none" : "block";
      e.currentTarget.textContent = visivel ? "ver observações ✎" : "ocultar observações";
    });
    on(".acao-nota", "mouseenter", (e) => {
      const id = e.currentTarget.dataset.id;
      if (e.currentTarget.dataset.nota) { state.notaHoverId = id; render(); }
    });
    on(".acao-nota", "click", (e) => abrirModalNota(e.currentTarget.dataset.id, e.currentTarget.dataset.nota || ""));
    on(".acao-data", "click", (e) => abrirModalData(e.currentTarget.dataset.id, e.currentTarget.dataset.quando));

    // esconder chip de nota ao sair do hover (delegado no container do histórico)
    const histWrap = app.querySelector(".hist-row") ? app : null;
    app.addEventListener("mouseleave", (e) => {
      if (state.notaHoverId !== null) { state.notaHoverId = null; render(); }
    }, true);
  }

  // ---------- Modais específicos ----------
  function abrirModalNovoCliente() {
    abrirModal("Novo cliente",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="nc-nome" placeholder="nome do cliente">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;">' +
      '<input class="input-field" id="nc-qtd" type="number" placeholder="qtd">' +
      '<input class="input-field" id="nc-valor" type="number" placeholder="valor">' +
      '<input class="input-field" id="nc-dia" type="number" min="1" max="31" placeholder="dia"></div>' +
      '<button class="btn btn-dark" id="nc-salvar" style="margin-top:4px;">adicionar cliente</button></div>',
      () => {
        document.getElementById("nc-salvar").addEventListener("click", () => {
          const nome = document.getElementById("nc-nome").value;
          const qtd = Number(document.getElementById("nc-qtd").value);
          const valor = Number(document.getElementById("nc-valor").value);
          const dia = Number(document.getElementById("nc-dia").value);
          if (!nome.trim() || !qtd || !valor || !dia) return;
          adicionarCliente({ nome, totalVideos: qtd, valorTotal: valor, diaPagamento: dia });
          fecharModal();
        });
      }
    );
  }

  function abrirModalEditarCliente(id) {
    const c = encontrarCliente(id); if (!c) return;
    abrirModal("Editar cliente",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="ec-nome" value="' + esc(c.nome) + '" placeholder="nome">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;">' +
      '<input class="input-field" id="ec-qtd" type="number" value="' + c.totalVideos + '" placeholder="qtd">' +
      '<input class="input-field" id="ec-valor" type="number" value="' + c.valorTotal + '" placeholder="valor">' +
      '<input class="input-field" id="ec-dia" type="number" min="1" max="31" value="' + c.diaPagamento + '" placeholder="dia"></div>' +
      '<textarea class="input-field" id="ec-notas" style="resize:vertical;min-height:60px;" placeholder="observações...">' + esc(c.notas || "") + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:4px;">' +
      '<button class="btn btn-dark" id="ec-salvar" style="flex:1;">salvar</button>' +
      '<button class="btn" id="ec-remover" style="color:var(--vermelho);">remover</button></div></div>',
      () => {
        document.getElementById("ec-salvar").addEventListener("click", () => {
          editarCliente(id, {
            nome: document.getElementById("ec-nome").value.trim() || c.nome,
            totalVideos: Number(document.getElementById("ec-qtd").value) || c.totalVideos,
            valorTotal: Number(document.getElementById("ec-valor").value) || c.valorTotal,
            diaPagamento: Number(document.getElementById("ec-dia").value) || c.diaPagamento,
            notas: document.getElementById("ec-notas").value,
          });
          fecharModal();
        });
        document.getElementById("ec-remover").addEventListener("click", () => { removerCliente(id); fecharModal(); });
      }
    );
  }

  function abrirModalMeta() {
    abrirModal("Meta mensal",
      '<input class="input-field" id="meta-input" type="number" value="' + state.meta + '">' +
      '<button class="btn btn-dark" id="meta-salvar" style="margin-top:10px;width:100%;">salvar meta</button>',
      () => {
        const input = document.getElementById("meta-input");
        input.focus();
        const salvarFn = () => { salvarMeta(Number(input.value) || state.meta); fecharModal(); };
        document.getElementById("meta-salvar").addEventListener("click", salvarFn);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") salvarFn(); });
      }
    );
  }

  function abrirModalDespesa() {
    abrirModal("Nova despesa",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="nd-nome" placeholder="nome da despesa (ex: internet, equipamento)">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">' +
      '<input class="input-field" id="nd-valor" type="number" placeholder="valor">' +
      '<input class="input-field" id="nd-categoria" placeholder="categoria (opcional)"></div>' +
      '<button class="btn btn-dark" id="nd-salvar" style="margin-top:4px;">adicionar despesa</button></div>',
      () => {
        document.getElementById("nd-salvar").addEventListener("click", () => {
          const nome = document.getElementById("nd-nome").value;
          const valor = Number(document.getElementById("nd-valor").value);
          const categoria = document.getElementById("nd-categoria").value;
          if (!nome.trim() || !valor) return;
          adicionarDespesa({ nome, valor, categoria });
          fecharModal();
        });
      }
    );
  }

  function abrirModalNota(id, notaAtual) {
    abrirModal("Observação do vídeo",
      '<textarea class="input-field" id="nota-input" style="resize:vertical;min-height:80px;" placeholder=\'ex: "vídeo sobre marketing digital", "entrevista com cliente X"...\'>' + esc(notaAtual) + '</textarea>' +
      '<button class="btn btn-dark" id="nota-salvar" style="margin-top:10px;width:100%;">salvar observação</button>',
      () => {
        const input = document.getElementById("nota-input");
        input.focus();
        document.getElementById("nota-salvar").addEventListener("click", () => {
          salvarNotaHistorico(id, input.value.trim());
          fecharModal();
          render();
        });
      }
    );
  }

  function abrirModalData(id, quandoISO) {
    abrirModal("Editar data e hora",
      '<input class="input-field" id="data-input" type="text" value="' + esc(paraInputDatetime(quandoISO)) + '" placeholder="DD/MM/AAAA HH:MM">' +
      '<div style="font-size:9.5px;color:var(--cinzaClaro);margin-top:6px;">formato: 28/08/2026 14:30</div>' +
      '<button class="btn btn-dark" id="data-salvar" style="margin-top:10px;width:100%;">salvar data</button>',
      () => {
        const input = document.getElementById("data-input");
        input.focus();
        document.getElementById("data-salvar").addEventListener("click", () => {
          const ok = salvarDataHistorico(id, input.value);
          if (ok) { fecharModal(); render(); }
          else toast("Data inválida — use o formato DD/MM/AAAA HH:MM", "var(--vermelho)");
        });
      }
    );
  }

  // ---------- Início ----------
  document.body.setAttribute("data-theme", state.tema);
  render();
})();
</script>
</body>
</html>
