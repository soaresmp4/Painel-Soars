  function renderAtividade() {
    const hoje = new Date();
    hoje.setHours(0,0,0,0);

    const semanaOffset = Number(state.producaoSemanaOffset || 0);
    const janelaOffset = Number(state.producaoJanelaOffset || 0);
    const baseSemana = new Date(hoje);
    const diaSemana = baseSemana.getDay();
    const distanciaSegunda = diaSemana === 0 ? -6 : 1 - diaSemana;
    baseSemana.setDate(baseSemana.getDate() + distanciaSegunda + (semanaOffset * 7));

    const nomesDias = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
    const inicioIndice = Math.max(0, Math.min(6, janelaOffset));
    const diasVisiveis = Math.min(3, 7 - inicioIndice);
    const tarefasPorDia = Array.from({length: diasVisiveis}, () => []);

    state.tarefas.forEach((t) => {
      if (!t.prazo) return;
      const d = new Date(t.prazo);
      if (Number.isNaN(d.getTime())) return;
      d.setHours(0,0,0,0);
      const indiceSemana = Math.round((d - baseSemana) / 86400000);
      if (indiceSemana >= inicioIndice && indiceSemana < inicioIndice + diasVisiveis) {
        tarefasPorDia[indiceSemana - inicioIndice].push(t);
      }
    });

    tarefasPorDia.forEach((lista) => lista.sort((a,b) => {
      if (a.concluida !== b.concluida) return a.concluida ? 1 : -1;
      return new Date(a.prazo) - new Date(b.prazo);
    }));

    const todas = tarefasPorDia.flat();
    const concluidas = todas.filter((t) => t.concluida).length;
    const primeira = new Date(baseSemana);
    primeira.setDate(primeira.getDate() + inicioIndice);
    const ultima = new Date(primeira);
    ultima.setDate(ultima.getDate() + diasVisiveis - 1);

    const inicioLabel = primeira.toLocaleDateString("pt-BR", {day:"2-digit", month:"short"}).replace(".", "");
    const fimLabel = ultima.toLocaleDateString("pt-BR", {day:"2-digit", month:"short"}).replace(".", "");

    let html = '<div class="weekly-production">';
    html += '<div class="weekly-production-head">';
    html += '<div class="weekly-production-summary"><span class="weekly-production-count"><strong>' + todas.length + '</strong> tarefa' + (todas.length !== 1 ? "s" : "") + ' nestes dias' + (concluidas ? ' · <strong>' + concluidas + '</strong> concluída' + (concluidas !== 1 ? 's' : '') : '') + '</span></div>';
    html += '<div class="weekly-production-nav">';
    html += '<button class="weekly-nav-arrow" id="producao-semana-ant" aria-label="Dias anteriores">‹</button>';
    html += '<span class="weekly-production-range">' + inicioLabel + ' — ' + fimLabel + '</span>';
    html += '<button class="weekly-nav-arrow" id="producao-semana-prox" aria-label="Próximos dias">›</button>';
    html += '<button class="weekly-nav-today" id="producao-semana-hoje">hoje</button>';
    html += '</div></div>';

    html += '<div class="weekly-production-grid">';
    for (let i = 0; i < diasVisiveis; i++) {
      const dia = new Date(baseSemana);
      dia.setDate(dia.getDate() + inicioIndice + i);
      const ehHoje = dia.getTime() === hoje.getTime();
      const lista = tarefasPorDia[i];
      html += '<div class="weekly-day' + (ehHoje ? ' today' : '') + '">';
      html += '<div class="weekly-day-head"><span class="weekly-day-name">' + nomesDias[inicioIndice + i] + '</span><span class="weekly-day-date' + (ehHoje ? ' today' : '') + '">' + dia.getDate() + '</span></div>';
      html += '<div class="weekly-day-tasks">';
      if (!lista.length) {
        html += '<div class="weekly-day-empty">sem tarefas</div>';
      } else {
        lista.forEach((t) => {
          const cliente = t.clienteId ? encontrarCliente(t.clienteId) : null;
          const corCliente = cliente ? (cliente.cor || "var(--cinzaClaro)") : "var(--cinzaClaro)";
          html += '<div class="weekly-task acao-semana-tarefa' + (t.concluida ? ' done' : '') + '" data-id="' + esc(t.id) + '" title="Abrir tarefa">';
          html += '<button class="weekly-task-check acao-semana-check" data-id="' + esc(t.id) + '" title="Marcar como concluída">' + (t.concluida ? iconeCheck() : '') + '</button>';
          html += '<div class="weekly-task-main">';
          html += '<div class="weekly-task-title">' + esc(t.texto) + '</div>';
          if (cliente) html += '<div class="weekly-task-client"><span class="weekly-task-client-dot" style="background:' + corCliente + '"></span>' + esc(cliente.nome) + '</div>';
          html += '</div></div>';
        });
      }
      html += '</div></div>';
    }
    html += '</div>';

    const temAnterior = inicioIndice > 0 || semanaOffset !== 0;
    const temProximo = inicioIndice + diasVisiveis < 7 || true;
    html += '<div class="weekly-production-foot"><span>' + (inicioIndice > 0 ? 'Outros dias nesta semana nas setas.' : '3 dias por vez para manter o painel compacto.') + '</span><span><strong>' + (todas.length - concluidas) + '</strong> em aberto</span></div>';
    html += '</div>';
    return html;
  }

  function renderCalendario() {
    const hoje = new Date();
    const ano = state.calAno, mes = state.calMes;
    const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
    const totalDias = new Date(ano, mes + 1, 0).getDate();
    const diasComEntrega = new Set(
      state.historico.filter((ev) => ev.tipo === "entrega" && ev.quantidade > 0)
        .map((ev) => new Date(ev.quando)).filter((d) => d.getFullYear() === ano && d.getMonth() === mes).map((d) => d.getDate())
    );
    const pagamentosPorDia = {};
    const chaveCalendario = chaveMesFinanceiro(ano, mes);
    state.clientes.forEach((c) => {
      const previsto = dataPrevistaPagamentoMes(c, ano, mes);
      if (!previsto) return;
      const diaPrevisto = previsto.getDate();
      (pagamentosPorDia[diaPrevisto] = pagamentosPorDia[diaPrevisto] || []).push({ cliente: c, recebido: !!pagamentoNoMesCliente(c, chaveCalendario) });
    });
    const tarefasPorDia = {};
    state.tarefas.forEach((t) => {
      if (!t.prazo) return;
      const d = new Date(t.prazo);
      if (d.getFullYear() === ano && d.getMonth() === mes) (tarefasPorDia[d.getDate()] = tarefasPorDia[d.getDate()] || []).push(t);
    });

    let html = '<div class="cal-weekdays">' + ["D", "S", "T", "Q", "Q", "S", "S"].map((d) => '<div class="cal-weekday">' + d + '</div>').join("") + '</div>';
    html += '<div class="cal-grid">';
    for (let i = 0; i < primeiroDiaSemana; i++) html += '<div></div>';
    for (let d = 1; d <= totalDias; d++) {
      const ehHoje = d === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear();
      const pagamentos = pagamentosPorDia[d];
      const teveEntrega = diasComEntrega.has(d);
      const tarefasDoDia = tarefasPorDia[d];
      let corPagamento = null;
      if (pagamentos) corPagamento = pagamentos.some((p) => !p.recebido) ? "var(--laranja)" : "var(--verde)";
      let dots = "";
      if (corPagamento) dots += '<span class="cal-dot" style="background:' + (ehHoje ? "var(--destaqueTexto)" : corPagamento) + '"></span>';
      if (teveEntrega) dots += '<span class="cal-dot" style="background:' + (ehHoje ? "var(--destaqueTexto)" : "var(--cinzaClaro)") + '"></span>';
      if (tarefasDoDia) dots += '<span class="cal-dot-tarefa" style="background:' + (ehHoje ? "var(--destaqueTexto)" : "var(--azul)") + '"></span>';
      const titulo = tarefasDoDia ? tarefasDoDia.map((t) => t.texto).join(", ") : "";
      html += '<div class="cal-cell' + (ehHoje ? " hoje" : "") + '"' + (titulo ? ' title="' + esc(titulo) + '"' : '') + '>' + d + '<div class="cal-dots">' + dots + '</div></div>';
    }
    html += '</div>';
    html += '<div class="cal-legend"><span><span class="cal-dot" style="background:var(--laranja);width:5px;height:5px;"></span> pagamento pendente</span>' +
            '<span><span class="cal-dot" style="background:var(--cinzaClaro);width:5px;height:5px;"></span> entrega registrada</span>' +
            '<span><span class="cal-dot-tarefa"></span> tarefa com prazo</span></div>';
    return html;
  }

  function renderPagamentos() {
    const lista = [...state.clientes].sort((a, b) => diasAteDia(a.diaPagamento) - diasAteDia(b.diaPagamento));
    if (lista.length === 0) return '<span style="font-size:10px;color:var(--cinzaClaro);">nenhum cliente ainda.</span>';
    const mesAtual = mesAtualFinanceiro();
    return lista.map((c) => {
      const stBase = statusPagamento(c);
      const st = pagamentoNoMesCliente(c, mesAtual) ? { cor: "var(--verde)", texto: "recebido" } : stBase;
      return '<div class="pagamento-row"><div style="display:flex;gap:8px;align-items:center;">' +
        '<div class="pagamento-avatar num" style="background:color-mix(in srgb, ' + (c.cor || "var(--cinzaClaro)") + ' 22%, transparent);color:' + (c.cor || "var(--texto)") + ';">' + esc(iniciais(c.nome)) + '</div>' +
        '<div><b style="font-size:10.5px;">' + esc(c.nome) + '</b><small style="display:block;color:' + st.cor + ';font-size:8.5px;font-weight:600;">' + st.texto + '</small></div></div>' +
        '<span class="num" style="font-size:10.5px;font-weight:600;">' + brl(c.valorTotal) + '</span></div>';
    }).join("");
  }

  function renderClienteCard(c) {
    const pct = Math.round((c.entregues / c.totalVideos) * 100) || 0;
    const completo = c.entregues >= c.totalVideos;
    const valorUnidade = c.valorTotal / c.totalVideos;
    const status = statusPagamento(c);
    let html = '<article class="card client-card" data-client-id="' + esc(c.id) + '">';
    html += '<div style="display:flex;align-items:center;gap:11px;">';
    html += '<div class="client-avatar num" style="background:color-mix(in srgb, ' + (c.cor || "var(--cinzaClaro)") + ' 22%, transparent);color:' + (c.cor || "var(--texto)") + ';">' + esc(iniciais(c.nome)) + '</div>';
    html += '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px;">' +
      '<span class="dot" style="width:7px;height:7px;background:' + status.cor + ';"></span>' + esc(c.nome) + '</div>' +
      '<div style="font-size:10.5px;color:var(--cinzaClaro);margin-top:2px;">' + c.totalVideos + ' vídeos · ' + brl(valorUnidade) + '/vídeo</div></div>';
    html += '<button class="acao-editar-cliente" data-id="' + esc(c.id) + '" style="background:transparent;border:none;color:var(--cinzaClaro);font-size:17px;cursor:pointer;">⋯</button>';
    html += '</div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;margin-top:16px;">' +
      '<div><label style="font-size:9px;color:var(--cinzaClaro);display:block;margin-bottom:3px;letter-spacing:.04em;">ENTREGUES</label>' +
      '<strong class="num" style="font-size:17px;">' + c.entregues + ' <small style="color:var(--cinzaClaro);font-size:10px;font-weight:400;">/ ' + c.totalVideos + '</small></strong></div>' +
      '<div style="text-align:right;"><label style="font-size:9px;color:var(--cinzaClaro);display:block;margin-bottom:3px;letter-spacing:.04em;">CONTRATO</label>' +
      '<strong class="num" style="font-size:15px;">' + brl(c.valorTotal) + '</strong></div></div>';

    html += '<div class="client-progress-bg"><div class="client-progress-fill' + (pct >= 100 ? " completo" : "") + '" style="width:' + Math.min(pct, 100) + '%"></div></div>';
    html += '<div style="display:flex;justify-content:space-between;margin-top:9px;font-size:9.5px;color:var(--cinza);">' +
      '<span>' + pct + '% concluído</span><span class="status-pill" style="color:' + status.cor + ';">' + status.texto + '</span></div>';

    if (completo) {
      html += '<div class="completo-banner"><span style="font-size:11px;color:var(--verde);font-weight:600;">🎉 pacote concluído</span>' +
        '<button class="btn btn-dark acao-novo-pacote" data-id="' + esc(c.id) + '" style="height:30px;font-size:10.5px;">iniciar novo pacote</button></div>';
    } else {
      html += '<div style="display:flex;gap:6px;margin-top:14px;">' +
        '<button class="btn acao-entrega" data-id="' + esc(c.id) + '" data-delta="-1">−</button>' +
        '<button class="btn btn-dark acao-entrega" data-id="' + esc(c.id) + '" data-delta="1" style="flex:1;">Registrar vídeo</button></div>';
    }
    html += '<div style="display:flex;gap:6px;margin-top:8px;"><button class="btn acao-pagamento" data-id="' + esc(c.id) + '" style="flex:1;color:' + (c.pago ? "var(--verde)" : "var(--cinza)") + ';">' + (c.pago ? "recebido ✓" : "marcar pago") + '</button></div>';

    if (c.notas) {
      html += '<div style="margin-top:12px;"><button class="acao-toggle-notas" data-id="' + esc(c.id) + '" style="background:transparent;border:none;color:var(--texto);font-size:9.5px;cursor:pointer;padding:0;font-weight:600;">ver observações ✎</button>' +
        '<div class="notas-conteudo" data-id="' + esc(c.id) + '" style="display:none;font-size:11px;color:var(--cinza);margin-top:7px;background:var(--inputBg);padding:10px 12px;border-radius:10px;line-height:1.5;">' + esc(c.notas) + '</div></div>';
    }
    html += '</article>';
    return html;
  }

  function encontrarClientePorNome(nome) { return state.clientes.find((c) => c.nome === nome); }

  function renderHistoricoAgrupado() {
    const lista = state.verTudoHistorico ? state.historico : state.historico.slice(0, 12);
    if (lista.length === 0) return '<div style="font-size:11px;color:var(--cinzaClaro);">nenhum evento ainda.</div>';
    const listaOrdenada = [...lista].sort((a, b) => new Date(b.quando) - new Date(a.quando));
    const grupos = [];
    listaOrdenada.forEach((ev) => {
      const d = new Date(ev.quando);
      const chave = d.getFullYear() + "-" + d.getMonth();
      let g = grupos.find((x) => x.chave === chave);
      if (!g) { g = { chave, label: nomeMes(d), itens: [] }; grupos.push(g); }
      g.itens.push(ev);
    });
    return grupos.map((g) => {
      let html = '<div style="margin-bottom:18px;"><div class="hist-group-label">' + esc(g.label) + '</div>';
      g.itens.forEach((ev) => {
        const cor = ev.tipo === "pagamento" ? "var(--verde)" : (ev.tipo === "pagamento-desfeito" || ev.tipo === "remocao") ? "var(--vermelho)" : (ev.tipo === "novo-cliente" || ev.tipo === "novo-pacote") ? "var(--laranja)" : ev.quantidade > 0 ? "var(--texto)" : "var(--laranja)";
        let desc = "";
        if (ev.tipo === "entrega") desc = " · " + (ev.quantidade > 0 ? "+" : "") + ev.quantidade + " vídeo (total " + ev.totalApos + ")";
        else if (ev.tipo === "pagamento") desc = " · pagamento recebido (" + brl(ev.valor) + ")";
        else if (ev.tipo === "pagamento-desfeito") desc = " · pagamento desmarcado";
        else if (ev.tipo === "novo-cliente") desc = " · cliente adicionado";
        else if (ev.tipo === "novo-pacote") desc = " · novo pacote iniciado (" + ev.quantidade + " vídeos)";
        else if (ev.tipo === "remocao") desc = " · cliente removido";
        else if (ev.tipo === "edicao") desc = " · " + esc(ev.detalhe);

        const clienteRef = encontrarClientePorNome(ev.clienteNome);
        const corNomeCliente = clienteRef ? clienteRef.cor : "var(--texto)";
        html += '<div class="hist-row"><span class="hist-left"><span class="dot" style="width:6px;height:6px;background:' + cor + ';"></span><b style="color:' + corNomeCliente + ';">' + esc(ev.clienteNome) + '</b>' + desc;
        if (ev.tipo === "entrega") {
          html += '<button class="note-btn acao-nota" data-id="' + esc(ev.id) + '" data-nota="' + esc(ev.nota || "") + '">' + iconeLapis(!!ev.nota) + '</button>';
        }
        html += '</span><span class="hist-mid">';
        if (state.notaHoverId === ev.id && ev.nota) html += '<span class="hist-note-chip">' + esc(ev.nota) + '</span>';
        html += '</span>';
        html += '<button class="hist-date-btn acao-data" data-id="' + esc(ev.id) + '" data-quando="' + esc(ev.quando) + '">' + fmtDataHora(ev.quando) + '</button></div>';
      });
      html += '</div>';
      return html;
    }).join("");
  }

  function renderConclusoes() {
    if (state.conclusoes.length === 0) return '<div style="font-size:11px;color:var(--cinzaClaro);">nenhum pacote concluído ainda — quando um cliente bater 100% de entregas, ele aparece aqui.</div>';
    const lista = state.conclusoes.slice(0, state.verTudoConclusoes ? state.conclusoes.length : 6);
    return lista.map((cn) =>
      '<div class="conclusao-row"><span style="display:flex;gap:8px;align-items:center;"><span class="dot" style="width:7px;height:7px;background:var(--verde);"></span><b>' + esc(cn.clienteNome) + '</b> · pacote de ' + cn.quantidade + ' vídeos concluído</span>' +
      '<span style="display:flex;align-items:center;gap:10px;"><span class="num" style="font-weight:600;color:var(--verde);">' + brl(cn.valor) + '</span>' +
      '<span class="num" style="color:var(--cinzaClaro);font-size:10px;">' + fmtDataHora(cn.quando) + '</span></span></div>'
    ).join("");
  }

  function renderContadorTarefas() {
    const total = state.tarefas.length;
    const feitas = state.tarefas.filter((t) => t.concluida).length;
    const faltam = total - feitas;
    if (total === 0) return "";
    const pct = Math.round((feitas / total) * 100);
    return '<div style="margin-bottom:12px;">' +
      '<div class="heading" style="font-size:10.5px;color:var(--cinzaClaro);margin-bottom:5px;">' + feitas + ' de ' + total + ' concluídas · ' + faltam + ' restante' + (faltam !== 1 ? "s" : "") + '</div>' +
      '<div class="meta-bar-bg" style="height:4px;"><div class="meta-bar-fill' + (pct >= 100 ? " completo" : "") + '" style="width:' + pct + '%"></div></div>' +
      '</div>';
  }

  function renderTarefas() {
    if (state.tarefas.length === 0) return '<div style="font-size:11px;color:var(--cinzaClaro);">nenhuma tarefa pendente — as que você adicionar aparecem aqui.</div>';
    const lista = [...state.tarefas].sort((a, b) => {
      if (!a.prazo && !b.prazo) return 0;
      if (!a.prazo) return 1;
      if (!b.prazo) return -1;
      return new Date(a.prazo) - new Date(b.prazo);
    });
    return lista.map((t) => {
      const st = statusTarefa(t);
      const cliente = t.clienteId ? encontrarCliente(t.clienteId) : null;
      const corCliente = cliente ? cliente.cor : null;
      return '<div class="tarefa-row">' +
        (corCliente ? '<span class="num" style="color:' + corCliente + ';font-weight:800;font-size:13px;flex-shrink:0;width:16px;text-align:center;" title="' + esc(cliente.nome) + '">' + esc(iniciais(cliente.nome)) + '</span>' : '') +
        '<button class="tarefa-checkbox acao-alternar-tarefa' + (t.concluida ? " marcada" : "") + '" data-id="' + esc(t.id) + '" title="Marcar como concluída">' + (t.concluida ? iconeCheck() : "") + '</button>' +
        '<button class="tarefa-texto acao-editar-tarefa' + (t.concluida ? " concluida" : "") + '" data-id="' + esc(t.id) + '">' + esc(t.texto) + '</button>' +
        (st.texto && !t.concluida ? '<span class="status-pill num" style="color:' + st.cor + ';flex-shrink:0;font-size:9.5px;">' + st.texto + '</span>' : '') +
        '</div>';
    }).join("");
  }

  function opcoesClientesSelect(selecionadoId) {
    let html = '<option value="">Sem cliente</option>';
    state.clientes.forEach((c) => {
      html += '<option value="' + esc(c.id) + '"' + (selecionadoId === c.id ? " selected" : "") + '>' + esc(c.nome) + '</option>';
    });
    return html;
  }

  function renderAnotacoes() {
    if (state.anotacoes.length === 0) return '<div style="font-size:11px;color:var(--cinzaClaro);">nenhuma anotação ainda — use esse espaço como bloco de notas rápido.</div>';
    return state.anotacoes.map((a) =>
      '<div class="anotacao-row"><span class="anotacao-texto">' + esc(a.texto) + '</span>' +
      '<button class="acao-remover-anotacao" data-id="' + esc(a.id) + '" style="background:transparent;border:none;color:var(--cinzaClaro);font-size:13px;cursor:pointer;flex-shrink:0;">✕</button></div>'
    ).join("");
  }

  function render() {
    document.body.setAttribute("data-theme", state.tema);

    const receitaMensal = state.clientes.reduce((s, c) => s + c.valorTotal, 0);
    const totalEntregues = state.clientes.reduce((s, c) => s + c.entregues, 0);
    const totalVideos = state.clientes.reduce((s, c) => s + c.totalVideos, 0);
    const mesDashboard = chaveMesFinanceiro(new Date().getFullYear(), new Date().getMonth());
    const recebido = state.clientes.reduce((s, c) => s + pagamentosDoMesCliente(c, mesDashboard).reduce((a,p) => a + Number(p.valor || 0), 0), 0);
    const aReceber = state.clientes.reduce((s, c) => {
      const pacote = pacoteAtualCliente(c);
      return s + (pacote && !pagamentoNoMesCliente(c, mesDashboard) ? Number(c.valorTotal || 0) : 0);
    }, 0);
    const hojeStr = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" }).toUpperCase();
    const pendentes = state.clientes.filter((c) => !pagamentoNoMesCliente(c, mesDashboard)).length;

    let html = "";

    // Header
    html += '<header class="top"><div>';
    html += '<div class="brand-row"><span class="num" style="font-size:13px;font-weight:700;letter-spacing:-.02em;">soars<span style="color:var(--cinzaClaro);">.mp4</span></span>';
    if (state.ultimoSalvo) html += '<span class="saved-indicator"><span class="pulse"></span>salvo às ' + fmtHora(state.ultimoSalvo) + '</span>';
    html += '</div>';
    html += '<small class="today-label">' + hojeStr + '</small>';
    html += '<h1 class="heading greeting">Olá, Luan.</h1></div>';
    html += '<div class="header-actions">';
    html += '<button class="btn-icon" id="btn-tema">' + (state.tema === "escuro" ? "☀︎" : "☾") + '</button>';
    if (!state.confirmarReset) {
      html += '<button class="btn" id="btn-reset">Resetar</button>';
    } else {
      html += '<span style="font-size:10px;color:var(--vermelho);">apagar tudo?</span>';
      html += '<button class="btn" id="btn-confirmar-reset" style="color:var(--vermelho);">confirmar</button>';
      html += '<button class="btn" id="btn-cancelar-reset">cancelar</button>';
    }
    html += '<button class="btn" id="btn-relatorio">Relatório</button>';
    html += '<button class="btn" id="btn-ir-financeiro">Financeiro</button>';
    html += '<button class="btn" id="btn-backup" title="Baixa um arquivo .json com todos os seus dados">Backup</button>';
    html += '<label class="btn" style="cursor:pointer;" title="Restaura os dados a partir de um backup .json">Importar<input type="file" id="input-importar" accept="application/json" style="display:none;"></label>';
    html += '<button class="btn btn-dark" id="btn-novo-cliente">+ Novo cliente</button>';
    html += '</div></header>';

    // Foto de topo — clique para escolher uma imagem direto pelo site
    const fotoTopoSrc = state.fotoTopo || "foto-topo.jpg";
    const fotoTemFonte = !!state.fotoTopo;
    html += '<div class="site-top-photo' + (fotoTemFonte ? '' : ' is-empty') + '" id="site-top-photo">' +
      '<img src="' + esc(fotoTopoSrc) + '" alt="Imagem de destaque" loading="eager" onerror="this.style.display=\'none\';this.parentElement.classList.add(\'is-empty\');">' +
      '<label class="site-top-photo-picker" title="Escolher ou trocar foto">' +
      '<span class="site-top-photo-picker-text">' + (fotoTemFonte ? 'trocar foto' : 'escolher foto') + '</span>' +
      '<input type="file" id="input-foto-topo" accept="image/*">' +
      '</label>' +
      '<div class="site-top-photo-fallback">clique para escolher uma foto para o topo</div>' +
      '</div>';

    // KPIs
    html += '<section class="kpi-grid">';
    html += '<div class="kpi kpi-destaque"><div class="kpi-label">RECEITA MENSAL</div><strong class="num kpi-value">' + brl(receitaMensal) + '</strong><span class="kpi-sub">' + state.clientes.length + ' contrato' + (state.clientes.length !== 1 ? "s" : "") + ' ativo' + (state.clientes.length !== 1 ? "s" : "") + '</span></div>';
    html += '<div class="kpi kpi-normal"><div class="kpi-label"><span class="dot" style="width:6px;height:6px;background:var(--verde);"></span>RECEBIDO</div><strong class="num kpi-value" style="color:var(--verde);">' + brl(recebido) + '</strong><span class="kpi-sub">' + (receitaMensal > 0 ? Math.round((recebido / receitaMensal) * 100) : 0) + '% do total</span></div>';
    html += '<div class="kpi kpi-normal"><div class="kpi-label"><span class="dot" style="width:6px;height:6px;background:var(--laranja);"></span>A RECEBER</div><strong class="num kpi-value" style="color:var(--laranja);">' + brl(aReceber) + '</strong><span class="kpi-sub">' + pendentes + ' pagamento' + (pendentes !== 1 ? "s" : "") + '</span></div>';
    html += '<div class="kpi kpi-normal"><div class="kpi-label">PRODUÇÃO</div><strong class="num kpi-value">' + totalEntregues + '/' + totalVideos + '</strong><span class="kpi-sub">' + (totalVideos > 0 ? Math.round((totalEntregues / totalVideos) * 100) : 0) + '% concluído</span></div>';
    html += '</section>';

    // Tarefas + Anotações rápidas
    html += '<section class="tarefas-notas-grid">';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
      '<h2 class="heading section-title">Tarefas</h2><span class="section-sub">' + state.tarefas.filter((t) => !t.concluida).length + ' pendente' + (state.tarefas.filter((t) => !t.concluida).length !== 1 ? "s" : "") + '</span></div>';
    html += renderContadorTarefas();
    html += renderTarefas();
    html += '<div class="tarefas-add-row" style="flex-wrap:wrap;">' +
      '<input class="input-field" id="tarefa-texto" placeholder="o que você precisa fazer?" style="flex:2;min-width:140px;">' +
      '<input class="input-field" id="tarefa-prazo" placeholder="prazo (opcional) DD/MM/AAAA" style="flex:1;min-width:120px;">' +
      '<select class="input-field" id="tarefa-cliente" style="flex:1;min-width:110px;">' + opcoesClientesSelect(null) + '</select>' +
      '<button class="btn btn-dark" id="tarefa-add">+</button></div></div>';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
      '<h2 class="heading section-title">Anotações rápidas</h2><span class="section-sub">' + state.anotacoes.length + '</span></div>';
    html += renderAnotacoes();
    html += '<div class="anotacoes-add-row">' +
      '<input class="input-field" id="anotacao-texto" placeholder="anote algo rápido...">' +
      '<button class="btn btn-dark" id="anotacao-add">+</button></div></div>';
    html += '</section>';

    // Financeiro
    html += renderFinanceiro();

    // Atividade / Calendário / Pagamentos
    html += '<section class="middle-grid">';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:14px;"><h2 class="heading section-title">Produção da semana</h2><span class="section-sub">TAREFAS</span></div>' + renderAtividade() + '</div>';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 class="heading section-title">Calendário</h2>' +
      '<div style="display:flex;align-items:center;gap:6px;">' +
      '<button class="btn-icon" id="cal-mes-anterior" style="width:22px;height:22px;font-size:11px;">‹</button>' +
      '<span class="section-sub" style="min-width:90px;text-align:center;">' + nomeMes(new Date(state.calAno, state.calMes, 1)).toUpperCase() + '</span>' +
      '<button class="btn-icon" id="cal-mes-proximo" style="width:22px;height:22px;font-size:11px;">›</button>' +
      '</div></div>' + renderCalendario() + '</div>';
    html += '<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h2 class="heading section-title">Pagamentos</h2><span class="section-sub">PRÓXIMOS</span></div><div>' + renderPagamentos() + '</div></div>';
    html += '</section>';

    // Clientes
    html += '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:26px 0 13px;">' +
      '<div><h2 class="heading" style="margin:0;font-size:15px;">Clientes</h2><p style="margin:4px 0 0;color:var(--cinzaClaro);font-size:9.5px;">Produção, pagamentos e observações.</p></div></div>';
    html += '<div class="clientes-grid">' + state.clientes.map(renderClienteCard).join("") + '</div>';
    if (state.clientes.length === 0) html += '<div style="text-align:center;color:var(--cinzaClaro);padding:24px 0;font-size:12px;">nenhum cliente — adicione um pelo botão acima.</div>';

    // Pacotes concluídos
    html += '<div style="margin-top:30px;"><h2 class="heading" style="margin:0 0 12px;font-size:14px;">Pacotes concluídos</h2>' + renderConclusoes() + '</div>';

    // Histórico
    html += '<div style="margin-top:30px;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;">' +
      '<h2 class="heading" style="margin:0;font-size:14px;">Histórico</h2>';
    if (state.historico.length > 12) html += '<button id="btn-ver-tudo-historico" style="background:transparent;border:none;color:var(--cinzaClaro);font-size:10px;cursor:pointer;">' + (state.verTudoHistorico ? "ver menos" : "ver tudo (" + state.historico.length + ")") + '</button>';
    html += '</div>' + renderHistoricoAgrupado() + '</div>';

    document.getElementById("app").innerHTML = html;
    ligarEventosApp();
  }

  // ---------- Ligação de eventos (delegação) ----------
  function ligarEventosApp() {
    const app = document.getElementById("app");

    const on = (sel, evento, fn) => { app.querySelectorAll(sel).forEach((el) => el.addEventListener(evento, fn)); };

    on("#btn-tema", "click", alternarTema);
    on("#btn-reset", "click", () => { state.confirmarReset = true; render(); });
    on("#btn-confirmar-reset", "click", resetarTudo);
    on("#btn-cancelar-reset", "click", () => { state.confirmarReset = false; render(); });
    on("#btn-relatorio", "click", exportarRelatorio);
    on("#btn-ir-financeiro", "click", () => document.getElementById("financeiro")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    on("#fin-add-aporte", "click", () => abrirModalAporteFinanceiro(state.financeiro.mesSelecionado || mesAtualFinanceiro(), null));
    on("#fin-acao-aporte", "click", () => abrirModalAporteFinanceiro(state.financeiro.mesSelecionado || mesAtualFinanceiro(), null));
    on("#fin-acao-despesa", "click", () => abrirModalDespesa(state.financeiro.mesSelecionado || mesAtualFinanceiro()));
    on("#fin-empty-despesa", "click", () => abrirModalDespesa(state.financeiro.mesSelecionado || mesAtualFinanceiro()));
    on("#fin-acao-receita", "click", () => abrirModalFinanceiroDetalhe("recebido", state.financeiro.mesSelecionado || mesAtualFinanceiro()));
    on("#fin-ver-movimentos", "click", () => abrirModalFinanceiroDetalhe("movimentos", state.financeiro.mesSelecionado || mesAtualFinanceiro()));
    on(".financeiro-summary-item", "click", (e) => abrirModalFinanceiroDetalhe(e.currentTarget.dataset.finDetail, state.financeiro.mesSelecionado || mesAtualFinanceiro()));
    on("#fin-editar-meta", "click", abrirModalMetaReserva);
    on("#fin-ver-despesas", "click", () => abrirModalFinanceiroDetalhe("despesas", state.financeiro.mesSelecionado || mesAtualFinanceiro()));
    on("#fin-mes-ant", "click", () => { const base=state.financeiro.mesSelecionado || mesAtualFinanceiro(); const [a,m]=base.split("-").map(Number); const d=new Date(a,m-2,1); state.financeiro.mesSelecionado=chaveMesFinanceiro(d.getFullYear(),d.getMonth()); render(); });
    on("#fin-mes-prox", "click", () => { const base=state.financeiro.mesSelecionado || mesAtualFinanceiro(); const [a,m]=base.split("-").map(Number); const d=new Date(a,m,1); state.financeiro.mesSelecionado=chaveMesFinanceiro(d.getFullYear(),d.getMonth()); render(); });
    on("#fin-mes-hoje", "click", () => { state.financeiro.mesSelecionado = mesAtualFinanceiro(); render(); });
    on(".acao-fin-mes", "click", (e) => abrirModalMesFinanceiro(e.currentTarget.dataset.chave));
    on("#btn-backup", "click", baixarBackup);
    on("#input-importar", "change", (e) => { if (e.target.files[0]) importarBackup(e.target.files[0]); });
    on("#input-foto-topo", "change", (e) => { if (e.target.files[0]) processarFotoTopo(e.target.files[0]); });
    on("#btn-novo-cliente", "click", abrirModalNovoCliente);
    on("#btn-editar-meta", "click", abrirModalMeta);
    on("#btn-nova-despesa", "click", () => abrirModalDespesa(state.financeiro.mesSelecionado || mesAtualFinanceiro()));
    on(".acao-editar-despesa", "click", (e) => abrirModalDespesa(null, e.currentTarget.dataset.id));
    on("#btn-ver-tudo-historico", "click", () => { state.verTudoHistorico = !state.verTudoHistorico; render(); });

    const addTarefaFn = () => {
      const texto = document.getElementById("tarefa-texto").value;
      const prazo = document.getElementById("tarefa-prazo").value;
      const clienteId = document.getElementById("tarefa-cliente").value;
      if (!texto.trim()) return;
      adicionarTarefa(texto, prazo, clienteId);
    };
    on("#tarefa-add", "click", addTarefaFn);
    on("#tarefa-texto", "keydown", (e) => { if (e.key === "Enter") addTarefaFn(); });
    on("#tarefa-prazo", "keydown", (e) => { if (e.key === "Enter") addTarefaFn(); });
    on(".acao-alternar-tarefa", "click", (e) => alternarTarefa(e.currentTarget.dataset.id));
    on(".acao-editar-tarefa", "click", (e) => abrirModalEditarTarefa(e.currentTarget.dataset.id));

    const addAnotacaoFn = () => {
      const texto = document.getElementById("anotacao-texto").value;
      if (!texto.trim()) return;
      adicionarAnotacao(texto);
    };
    on("#anotacao-add", "click", addAnotacaoFn);
    on("#anotacao-texto", "keydown", (e) => { if (e.key === "Enter") addAnotacaoFn(); });
    on(".acao-remover-anotacao", "click", (e) => removerAnotacao(e.currentTarget.dataset.id));

    on("#cal-mes-anterior", "click", () => { state.calMes--; if (state.calMes < 0) { state.calMes = 11; state.calAno--; } render(); });
    on("#cal-mes-proximo", "click", () => { state.calMes++; if (state.calMes > 11) { state.calMes = 0; state.calAno++; } render(); });
    on("#producao-semana-ant", "click", () => {
      let janela = Number(state.producaoJanelaOffset || 0);
      let semana = Number(state.producaoSemanaOffset || 0);
      if (janela === 4) janela = 3;
      else if (janela === 3) janela = 0;
      else { janela = 4; semana -= 1; }
      state.producaoJanelaOffset = janela;
      state.producaoSemanaOffset = semana;
      render();
    });
    on("#producao-semana-prox", "click", () => {
      let janela = Number(state.producaoJanelaOffset || 0);
      let semana = Number(state.producaoSemanaOffset || 0);
      if (janela === 0) janela = 3;
      else if (janela === 3) janela = 4;
      else { janela = 0; semana += 1; }
      state.producaoJanelaOffset = janela;
      state.producaoSemanaOffset = semana;
      render();
    });
    on("#producao-semana-hoje", "click", () => {
      const hoje = new Date();
      const diaSemana = hoje.getDay();
      const indiceHoje = diaSemana === 0 ? 6 : diaSemana - 1;
      state.producaoSemanaOffset = 0;
      state.producaoJanelaOffset = Math.max(0, Math.min(4, indiceHoje - 1));
      state.calMes = hoje.getMonth();
      state.calAno = hoje.getFullYear();
      render();
    });
    on(".acao-semana-check", "click", (e) => { e.stopPropagation(); alternarTarefa(e.currentTarget.dataset.id); });
    on(".acao-semana-tarefa", "click", (e) => { if (e.target.closest(".acao-semana-check")) return; abrirModalEditarTarefa(e.currentTarget.dataset.id); });

    on(".acao-entrega", "click", (e) => registrarEntrega(e.currentTarget.dataset.id, Number(e.currentTarget.dataset.delta)));
    on(".acao-novo-pacote", "click", (e) => iniciarNovoPacote(e.currentTarget.dataset.id));
    on(".acao-pagamento", "click", (e) => registrarPagamento(e.currentTarget.dataset.id));
    on(".acao-editar-cliente", "click", (e) => abrirModalEditarCliente(e.currentTarget.dataset.id));
    on(".acao-remover-despesa", "click", (e) => removerDespesa(e.currentTarget.dataset.id));
    on(".acao-toggle-notas", "click", (e) => {
      const id = e.currentTarget.dataset.id;
      const conteudo = app.querySelector('.notas-conteudo[data-id="' + CSS.escape(id) + '"]');
      const visivel = conteudo.style.display !== "none";
      conteudo.style.display = visivel ? "none" : "block";
      e.currentTarget.textContent = visivel ? "ver observações ✎" : "ocultar observações";
    });
    on(".acao-nota", "mouseenter", (e) => {
      const id = e.currentTarget.dataset.id;
      if (e.currentTarget.dataset.nota) { state.notaHoverId = id; render(); }
    });
    on(".acao-nota", "click", (e) => abrirModalNota(e.currentTarget.dataset.id, e.currentTarget.dataset.nota || ""));
    on(".acao-data", "click", (e) => abrirModalData(e.currentTarget.dataset.id, e.currentTarget.dataset.quando));

    app.addEventListener("mouseleave", (e) => {
      if (state.notaHoverId !== null) { state.notaHoverId = null; render(); }
    }, true);
  }

  // ---------- Modais específicos ----------
  function abrirModalNovoCliente() {
    abrirModal("Novo cliente",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="nc-nome" placeholder="nome do cliente">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;">' +
      '<input class="input-field" id="nc-qtd" type="number" placeholder="qtd">' +
      '<input class="input-field" id="nc-valor" type="number" placeholder="valor">' +
      '<input class="input-field" id="nc-dia" type="number" min="1" max="31" placeholder="dia"></div>' +
      '<button class="btn btn-dark" id="nc-salvar" style="margin-top:4px;">adicionar cliente</button></div>',
      () => {
        document.getElementById("nc-salvar").addEventListener("click", () => {
          const nome = document.getElementById("nc-nome").value;
          const qtd = Number(document.getElementById("nc-qtd").value);
          const valor = Number(document.getElementById("nc-valor").value);
          const dia = Number(document.getElementById("nc-dia").value);
          if (!nome.trim() || !qtd || !valor || !dia) return;
          adicionarCliente({ nome, totalVideos: qtd, valorTotal: valor, diaPagamento: dia });
          fecharModal();
        });
      }
    );
  }

  function abrirModalEditarCliente(id) {
    const c = encontrarCliente(id); if (!c) return;
    abrirModal("Editar cliente",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="ec-nome" value="' + esc(c.nome) + '" placeholder="nome">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;">' +
      '<input class="input-field" id="ec-qtd" type="number" value="' + c.totalVideos + '" placeholder="qtd">' +
      '<input class="input-field" id="ec-valor" type="number" value="' + c.valorTotal + '" placeholder="valor">' +
      '<input class="input-field" id="ec-dia" type="number" min="1" max="31" value="' + c.diaPagamento + '" placeholder="dia"></div>' +
      '<textarea class="input-field" id="ec-notas" style="resize:vertical;min-height:60px;" placeholder="observações...">' + esc(c.notas || "") + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:4px;">' +
      '<button class="btn btn-dark" id="ec-salvar" style="flex:1;">salvar</button>' +
      '<button class="btn" id="ec-remover" style="color:var(--vermelho);">remover</button></div></div>',
      () => {
        document.getElementById("ec-salvar").addEventListener("click", () => {
          editarCliente(id, {
            nome: document.getElementById("ec-nome").value.trim() || c.nome,
            totalVideos: Number(document.getElementById("ec-qtd").value) || c.totalVideos,
            valorTotal: Number(document.getElementById("ec-valor").value) || c.valorTotal,
            diaPagamento: Number(document.getElementById("ec-dia").value) || c.diaPagamento,
            notas: document.getElementById("ec-notas").value,
          });
          fecharModal();
        });
        document.getElementById("ec-remover").addEventListener("click", () => { removerCliente(id); fecharModal(); });
      }
    );
  }

  function abrirModalEditarTarefa(id) {
    const t = state.tarefas.find((x) => x.id === id); if (!t) return;
    abrirModal("Editar tarefa",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="et-texto" value="' + esc(t.texto) + '" placeholder="o que você precisa fazer?">' +
      '<input class="input-field" id="et-prazo" value="' + (t.prazo ? esc(new Date(t.prazo).toLocaleDateString("pt-BR")) : "") + '" placeholder="prazo (opcional) DD/MM/AAAA">' +
      '<select class="input-field" id="et-cliente">' + opcoesClientesSelect(t.clienteId) + '</select>' +
      '<div style="display:flex;gap:8px;margin-top:4px;">' +
      '<button class="btn btn-dark" id="et-salvar" style="flex:1;">salvar</button>' +
      '<button class="btn" id="et-remover" style="color:var(--vermelho);">remover</button></div></div>',
      () => {
        document.getElementById("et-salvar").addEventListener("click", () => {
          editarTarefa(id, { texto: document.getElementById("et-texto").value, prazo: document.getElementById("et-prazo").value, clienteId: document.getElementById("et-cliente").value });
          fecharModal();
        });
        document.getElementById("et-remover").addEventListener("click", () => { removerTarefa(id); fecharModal(); });
      }
    );
  }

  function abrirModalMeta() {
    abrirModal("Meta de receita",
      '<input class="input-field" id="meta-input" type="number" value="' + state.meta + '">' +
      '<button class="btn btn-dark" id="meta-salvar" style="margin-top:10px;width:100%;">salvar meta</button>',
      () => {
        const input = document.getElementById("meta-input");
        input.focus();
        const salvarFn = () => { salvarMeta(Number(input.value) || state.meta); fecharModal(); };
        document.getElementById("meta-salvar").addEventListener("click", salvarFn);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") salvarFn(); });
      }
    );
  }

  function abrirModalDespesa(chaveMes, id) {
    const itemReal = id ? state.despesas.find(d => d.id === id) : null;
    const virtualFixa = id && id.startsWith('fixa-') ? (() => {
      const partes = id.split('-');
      const chave = partes.slice(-2).join('-');
      const fixaId = partes.slice(0, -2).join('-');
      return { fixa: despesaFixaDoId(fixaId), chave, fixaId };
    })() : null;
    const item = itemReal || (virtualFixa?.fixa ? { ...virtualFixa.fixa, fixaId: virtualFixa.fixaId, virtual: true, dataCompra: dataFixaCompraParaPagamento(virtualFixa.fixa, virtualFixa.chave), dataPagamento: dataFixaPagamentoNoMes(virtualFixa.fixa, virtualFixa.chave) } : null);
    const chave = chaveMes || (itemReal?.dataPagamento ? chaveMesFinanceiro(new Date(itemReal.dataPagamento).getFullYear(), new Date(itemReal.dataPagamento).getMonth()) : (itemReal?.quando ? chaveMesFinanceiro(new Date(itemReal.quando).getFullYear(), new Date(itemReal.quando).getMonth()) : (virtualFixa?.chave || mesAtualFinanceiro())));
    const dataCompraPadrao = item?.dataCompra ? new Date(item.dataCompra).toISOString().slice(0,10) : (item?.quando ? new Date(item.quando).toISOString().slice(0,10) : (chave === mesAtualFinanceiro() ? new Date().toISOString().slice(0,10) : chave + '-01'));
    const dataPagamentoPadrao = item?.dataPagamento ? new Date(item.dataPagamento).toISOString().slice(0,10) : (item?.quando ? new Date(item.quando).toISOString().slice(0,10) : dataCompraPadrao);
    const fixaMarcada = !!item?.fixaId || !!item?.id && !!despesaFixaDoId(item.id);

    abrirModal(item ? 'Editar despesa' : 'Nova despesa',
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="nd-nome" value="' + esc(item?.nome || '') + '" placeholder="nome da despesa (ex: Adobe, internet)">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">' +
      '<input class="input-field" id="nd-valor" type="number" step="0.01" value="' + (item?.valor ?? '') + '" placeholder="valor">' +
      '<input class="input-field" id="nd-categoria" value="' + esc(item?.categoria || '') + '" placeholder="tipo (ex: software)"></div>' +
      '<select class="input-field" id="nd-forma">' +
      '<option value="conta"' + ((item?.formaPagamento || 'conta') === 'conta' ? ' selected' : '') + '>conta / pix / débito</option>' +
      '<option value="cartao"' + ((item?.formaPagamento || '') === 'cartao' ? ' selected' : '') + '>cartão</option>' +
      '</select>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">' +
      '<div><label style="display:block;font-size:8px;color:var(--cinzaClaro);margin:0 0 4px 2px;">data da compra</label><input class="input-field" id="nd-compra" type="date" value="' + esc(dataCompraPadrao) + '"></div>' +
      '<div><label style="display:block;font-size:8px;color:var(--cinzaClaro);margin:0 0 4px 2px;">data do pagamento</label><input class="input-field" id="nd-pagamento" type="date" value="' + esc(dataPagamentoPadrao) + '"></div>' +
      '</div>' +
      ((!item || (itemReal && !fixaMarcada)) ? '<label style="display:flex;align-items:center;gap:8px;font-size:9px;color:var(--cinza);cursor:pointer;"><input id="nd-fixa" type="checkbox" style="accent-color:var(--verde);"' + ((!item && false) || fixaMarcada ? ' checked' : '') + '> despesa fixa · repetir automaticamente todos os meses</label>' : (fixaMarcada ? '<div style="font-size:8.5px;color:var(--cinzaClaro);background:var(--inputBg);padding:9px 10px;border-radius:9px;">Despesa fixa. As datas de compra e pagamento definem o ciclo; os próximos meses acompanham essa configuração.</div>' : '')) +
      '<button class="btn btn-dark" id="nd-salvar" style="margin-top:4px;">' + (item ? 'salvar alterações' : 'adicionar despesa') + '</button>' +
      (itemReal ? '<button class="btn" id="nd-remover" style="color:var(--vermelho);">remover lançamento</button>' : '') +
      (fixaMarcada && item?.fixaId ? '<button class="btn" id="nd-desativar-fixa" style="color:var(--vermelho);">desativar recorrência</button>' : '') +
      '</div>',
      () => {
        document.getElementById('nd-forma').addEventListener('change', () => {
          const forma = document.getElementById('nd-forma').value;
          const pagamento = document.getElementById('nd-pagamento');
          pagamento.title = forma === 'cartao' ? 'Mês em que a fatura será paga' : 'Data em que o dinheiro sairá';
        });
        document.getElementById('nd-salvar').addEventListener('click', () => {
          const nome = document.getElementById('nd-nome').value;
          const valor = Number(document.getElementById('nd-valor').value);
          const categoria = document.getElementById('nd-categoria').value;
          const formaPagamento = document.getElementById('nd-forma').value;
          const dataCompra = document.getElementById('nd-compra').value;
          const dataPagamento = document.getElementById('nd-pagamento').value;
          if (!nome.trim() || !valor || !dataCompra || !dataPagamento) return toast('Preencha nome, valor e as duas datas', 'var(--vermelho)');
          if (new Date(dataPagamento + 'T12:00:00') < new Date(dataCompra + 'T12:00:00')) return toast('A data do pagamento não pode ser anterior à compra', 'var(--vermelho)');
          if (item?.fixaId) {
            editarDespesaFixa(item.fixaId, { nome, valor, categoria, formaPagamento, diaCompra: Number(dataCompra.slice(-2)) || 1, diaPagamento: Number(dataPagamento.slice(-2)) || 1, chave });
          } else if (itemReal) {
            const tornarFixa = document.getElementById('nd-fixa')?.checked;
            if (tornarFixa) {
              const fixa = { id: 'fixa-' + uid(), nome: nome.trim(), valor, categoria: categoria.trim() || 'Fixa', diaCompra: Number(dataCompra.slice(-2)) || 1, diaPagamento: Number(dataPagamento.slice(-2)) || 1, dia: Number(dataPagamento.slice(-2)) || 1, formaPagamento, inicio: chaveMesDaDataISO(new Date(dataPagamento + 'T12:00:00').toISOString()), ativo: true };
              state.financeiro.despesasFixas.push(fixa);
              itemReal.fixaId = fixa.id;
              itemReal.fixa = true;
              itemReal.nome = fixa.nome; itemReal.valor = fixa.valor; itemReal.categoria = fixa.categoria; itemReal.formaPagamento = fixa.formaPagamento; itemReal.dataCompra = new Date(dataCompra + 'T12:00:00').toISOString(); itemReal.dataPagamento = new Date(dataPagamento + 'T12:00:00').toISOString(); itemReal.quando = itemReal.dataPagamento;
              salvarFinanceiro(); salvar(K_DESPESAS, state.despesas);
              toast('Despesa convertida em fixa · será repetida nos próximos meses', 'var(--vermelho)');
              render();
            } else {
              editarDespesa(itemReal.id, { nome, valor, categoria, formaPagamento, dataCompra, dataPagamento });
            }
          } else {
            const fixa = document.getElementById('nd-fixa')?.checked;
            adicionarDespesa({ nome, valor, categoria, formaPagamento, dataCompra, dataPagamento, fixa });
          }
          fecharModal();
        });
        if (itemReal && document.getElementById('nd-remover')) document.getElementById('nd-remover').addEventListener('click', () => { removerDespesa(itemReal.id); fecharModal(); });
        if (fixaMarcada && item?.fixaId && document.getElementById('nd-desativar-fixa')) document.getElementById('nd-desativar-fixa').addEventListener('click', () => { desativarDespesaFixa(item.fixaId); fecharModal(); });
      }
    );
  }

  function abrirModalNota(id, notaAtual) {
    abrirModal("Observação do vídeo",
      '<textarea class="input-field" id="nota-input" style="resize:vertical;min-height:80px;" placeholder=\'ex: "vídeo sobre marketing digital", "entrevista com cliente X"...\'>' + esc(notaAtual) + '</textarea>' +
      '<button class="btn btn-dark" id="nota-salvar" style="margin-top:10px;width:100%;">salvar observação</button>',
      () => {
        const input = document.getElementById("nota-input");
        input.focus();
        document.getElementById("nota-salvar").addEventListener("click", () => {
          salvarNotaHistorico(id, input.value.trim());
          fecharModal();
          render();
        });
      }
    );
  }

  function abrirModalData(id, quandoISO) {
    abrirModal("Editar data e hora",
      '<input class="input-field" id="data-input" type="text" value="' + esc(paraInputDatetime(quandoISO)) + '" placeholder="DD/MM/AAAA HH:MM">' +
      '<div style="font-size:9.5px;color:var(--cinzaClaro);margin-top:6px;">formato: 28/08/2026 14:30 (a hora é opcional — pode digitar só 28/08/2026)</div>' +
      '<button class="btn btn-dark" id="data-salvar" style="margin-top:10px;width:100%;">salvar data</button>',
      () => {
        const input = document.getElementById("data-input");
        input.focus();
        document.getElementById("data-salvar").addEventListener("click", () => {
          const ok = salvarDataHistorico(id, input.value);
          if (ok) { fecharModal(); render(); }
          else toast("Data inválida — use o formato DD/MM/AAAA HH:MM", "var(--vermelho)");
        });
      }
    );
  }

  // ---------- Início ----------
  document.body.setAttribute("data-theme", state.tema);
  render();
})();
</script>
</body>
</html>
