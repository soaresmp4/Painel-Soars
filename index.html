<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>soars.mp4 — painel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:#000000; --card:#111113; --cardHover:#17171A;
    --texto:#F5F5F5; --cinza:#98989D; --cinzaClaro:#5A5A5E; --inputBg:#0C0C0E;
    --destaque:#FFFFFF; --destaqueTexto:#000000;
    --verde:#32D74B; --laranja:#FF9F0A; --vermelho:#FF453A; --azul:#0A84FF; --amarelo:#FFD60A;
    --sombraCard: 0 1px 0 rgba(255,255,255,0.05) inset, 0 12px 32px -16px rgba(0,0,0,0.7);
    --sombraFlutuante: 0 20px 50px -12px rgba(0,0,0,0.7);
    --divisor: rgba(255,255,255,0.08); --borda:rgba(255,255,255,0.08);
  }
  [data-theme="claro"] {
    --bg:#F2F2F5; --card:#FFFFFF; --cardHover:#FBFBFD;
    --texto:#1D1D1F; --cinza:#86868B; --cinzaClaro:#C6C6C9; --inputBg:#F5F5F7;
    --destaque:#1D1D1F; --destaqueTexto:#FFFFFF;
    --verde:#30B350; --laranja:#E6890C; --vermelho:#E0362C; --azul:#0071E3; --amarelo:#D9A400;
    --sombraCard: 0 1px 0 rgba(255,255,255,0.6) inset, 0 12px 32px -18px rgba(0,0,0,0.16);
    --sombraFlutuante: 0 24px 60px -14px rgba(0,0,0,0.22);
    --divisor: rgba(0,0,0,0.07); --borda:rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--texto);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    transition: background .3s, color .3s;
  }
  .num { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
  .heading { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; }
  button { -webkit-tap-highlight-color: transparent; font-family: inherit; }
  button:hover { filter: brightness(1.15); }
  [data-theme="claro"] button:hover { filter: brightness(0.97); }
  input, textarea { font-family: 'Inter', sans-serif; }
  input::placeholder, textarea::placeholder { color: var(--cinzaClaro); }
  input:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--destaque) 30%, transparent); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--divisor); border-radius: 8px; }

  .btn { height:34px; border:none; background:var(--inputBg); border-radius:10px; color:var(--cinza); font-size:11.5px; padding:0 13px; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .btn-dark { background:var(--destaque); color:var(--destaqueTexto); }
  .btn-icon { width:34px; height:34px; border-radius:10px; border:none; background:var(--inputBg); color:var(--texto); font-size:14px; cursor:pointer; display:grid; place-items:center; }
  .card { background:var(--card); border-radius:18px; padding:18px; box-shadow: var(--sombraCard); }
  .dot { display:inline-block; border-radius:50%; flex-shrink:0; }
  .input-field { border:none; background:var(--inputBg); border-radius:10px; padding:11px 13px; font-size:12.5px; outline:none; color:var(--texto); width:100%; }

  #app { padding: 28px 32px 44px; max-width: 1300px; margin: 0 auto; }
  header.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .saved-indicator { display:flex; align-items:center; gap:4px; font-size:9px; color:var(--cinzaClaro); }
  .pulse { width:5px; height:5px; border-radius:50%; background:var(--verde); animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
  .today-label { display:block; color:var(--cinzaClaro); font-size:9.5px; margin-bottom:5px; letter-spacing:.06em; }
  h1.greeting { margin:0; font-size:26px; font-weight:700; letter-spacing:-.03em; }
  .header-actions { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }

  /* ---------- Foto de topo ---------- */
  .site-top-photo {
    width:100%;
    height:260px;
    margin:0 0 22px;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    background:var(--inputBg);
    box-shadow:var(--sombraCard);
  }
  .site-top-photo img {
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    transition:transform .45s cubic-bezier(.16,1,.3,1), filter .3s ease;
  }
  .site-top-photo:hover img {
    transform:scale(1.012);
  }
  .site-top-photo-picker {
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:rgba(0,0,0,0);
    transition:background .25s ease;
  }
  .site-top-photo-picker:hover {
    background:rgba(0,0,0,.16);
  }
  .site-top-photo-picker-text {
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 13px;
    border-radius:11px;
    background:rgba(0,0,0,.58);
    color:#fff;
    font-size:11px;
    font-weight:600;
    letter-spacing:-.01em;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .2s ease, transform .2s ease;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .site-top-photo-picker:hover .site-top-photo-picker-text,
  .site-top-photo.is-empty .site-top-photo-picker-text {
    opacity:1;
    transform:none;
  }
  .site-top-photo-picker input { display:none; }
  .site-top-photo-fallback {
    position:absolute;
    inset:0;
    z-index:1;
    display:grid;
    place-items:center;
    padding:20px;
    text-align:center;
    color:var(--cinzaClaro);
    font-size:10px;
    background:var(--inputBg);
    pointer-events:none;
  }
  .site-top-photo:not(.is-empty) .site-top-photo-fallback { display:none; }
  .site-top-photo.is-empty {
    border:1px dashed var(--borda);
  }
  @media (max-width:700px) {
    .site-top-photo { height:180px; border-radius:16px; margin-bottom:18px; }
  }

  .kpi-grid { display:grid; grid-template-columns:1.15fr 1fr 1fr 1fr; gap:11px; margin-bottom:22px; }
  .kpi { border-radius:18px; padding:17px 18px; box-shadow:var(--sombraCard); }
  .kpi-label { font-size:9.5px; letter-spacing:.04em; display:flex; align-items:center; gap:5px; }
  .kpi-value { display:block; font-size:23px; letter-spacing:-.03em; margin-top:12px; }
  .kpi-sub { font-size:9px; }
  .kpi-destaque { background:var(--destaque); color:var(--destaqueTexto); }
  .kpi-destaque .kpi-label { color: color-mix(in srgb, var(--destaqueTexto) 55%, transparent); }
  .kpi-destaque .kpi-sub { color: color-mix(in srgb, var(--destaqueTexto) 40%, transparent); }
  .kpi-normal { background:var(--card); color:var(--texto); }
  .kpi-normal .kpi-label { color:var(--cinza); }
  .kpi-normal .kpi-sub { color:var(--cinzaClaro); }

  .section-title { margin:0; font-size:12.5px; }
  .section-sub { font-size:9px; color:var(--cinzaClaro); letter-spacing:.04em; }

  .meta-bar-bg { height:7px; background:var(--inputBg); border-radius:10px; overflow:hidden; }
  .meta-bar-fill { height:100%; border-radius:10px; transition:width .5s cubic-bezier(.16,1,.3,1); background:var(--destaque); }
  .meta-bar-fill.completo { background:var(--verde); }


  .tarefas-notas-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:12px; align-items:stretch; }
  .tarefa-row { display:flex; align-items:center; gap:10px; padding:9px 11px; background:var(--inputBg); border-radius:10px; margin-bottom:6px; }
  .tarefa-checkbox { width:19px; height:19px; border-radius:5px; border:2px solid var(--cinzaClaro); background:transparent; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0; }
  .tarefa-checkbox.marcada { background:var(--verde); border-color:var(--verde); }
  .tarefa-texto { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; flex:1; text-align:left; background:transparent; border:none; color:var(--texto); padding:0; }
  .tarefa-texto.concluida { text-decoration:line-through; color:var(--cinzaClaro); }
  .tarefas-add-row { display:flex; gap:7px; margin-top:12px; }
  .anotacao-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:9px 11px; background:var(--inputBg); border-radius:10px; margin-bottom:6px; }
  .anotacao-texto { font-size:11.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; flex:1; }
  .anotacoes-add-row { display:flex; gap:7px; margin-top:12px; }

  .middle-grid { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:11px; margin-bottom:12px; align-items:stretch; }

  /* Produção semanal compacta — 3 dias por vez */
  .weekly-production { min-width:0; }
  .weekly-production-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .weekly-production-summary { min-width:0; }
  .weekly-production-count { font-size:9px; color:var(--cinzaClaro); }
  .weekly-production-count strong { color:var(--texto); font-size:11px; }
  .weekly-production-nav { display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .weekly-production-nav button { border:0; background:var(--inputBg); color:var(--texto); border-radius:8px; cursor:pointer; transition:transform .18s ease, background .18s ease, color .18s ease; }
  .weekly-production-nav button:hover { background:var(--cardHover); transform:translateY(-1px); }
  .weekly-production-nav .weekly-nav-arrow { width:26px; height:26px; font-size:13px; }
  .weekly-production-nav .weekly-nav-today { height:26px; padding:0 8px; font-size:8px; color:var(--cinza); }
  .weekly-production-range { min-width:100px; text-align:center; font-size:8.5px; font-weight:650; color:var(--cinza); text-transform:lowercase; }
  .weekly-production-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .weekly-day { min-width:0; background:var(--inputBg); border-radius:12px; padding:9px 7px 7px; transition:transform .18s ease, background .18s ease; }
  .weekly-day:hover { background:var(--cardHover); transform:translateY(-1px); }
  .weekly-day.today { background:color-mix(in srgb,var(--destaque) 8%,var(--inputBg)); }
  .weekly-day-head { display:flex; align-items:center; justify-content:space-between; gap:5px; margin-bottom:7px; padding:0 2px; }
  .weekly-day-name { font-size:7.5px; color:var(--cinzaClaro); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .weekly-day-date { min-width:21px; height:21px; border-radius:7px; display:grid; place-items:center; font-size:8.5px; font-weight:700; color:var(--cinza); }
  .weekly-day-date.today { background:var(--destaque); color:var(--destaqueTexto); }
  .weekly-day-tasks { display:flex; flex-direction:column; gap:4px; min-height:92px; max-height:154px; overflow:auto; padding-right:1px; }
  .weekly-day-tasks::-webkit-scrollbar { width:3px; }
  .weekly-day-tasks::-webkit-scrollbar-thumb { background:var(--divisor); border-radius:8px; }
  .weekly-task { width:100%; display:flex; align-items:flex-start; gap:6px; padding:7px 6px; border:0; background:var(--card); color:var(--texto); border-radius:9px; text-align:left; cursor:pointer; box-shadow:var(--sombraCard); transition:transform .16s ease, background .16s ease, box-shadow .16s ease; }
  .weekly-task:hover { background:var(--cardHover); transform:translateY(-1px); box-shadow:var(--sombraFlutuante); }
  .weekly-task.done { opacity:.5; }
  .weekly-task-check { width:14px; height:14px; border-radius:4px; border:1.5px solid var(--cinzaClaro); display:grid; place-items:center; flex:0 0 14px; margin-top:1px; background:transparent; padding:0; }
  .weekly-task.done .weekly-task-check { background:var(--verde); border-color:var(--verde); color:#000; }
  .weekly-task-check svg { width:8px; height:8px; }
  .weekly-task-main { min-width:0; flex:1; }
  .weekly-task-title { font-size:9.1px; line-height:1.3; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .weekly-task.done .weekly-task-title { text-decoration:line-through; color:var(--cinzaClaro); }
  .weekly-task-client { display:flex; align-items:center; gap:4px; margin-top:3px; font-size:7.4px; color:var(--cinzaClaro); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .weekly-task-client-dot { width:4px; height:4px; border-radius:50%; flex:0 0 4px; }
  .weekly-day-empty { min-height:92px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--cinzaClaro); font-size:7.8px; padding:8px; }
  .weekly-production-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; padding:0 2px; font-size:7.5px; color:var(--cinzaClaro); }
  .weekly-production-foot strong { color:var(--texto); }

  .cal-weekdays, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-weekdays { margin-bottom:6px; }
  .cal-weekday { text-align:center; font-size:8.5px; color:var(--cinzaClaro); font-weight:600; }
  .cal-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; font-size:10.5px; font-weight:500; position:relative; }
  .cal-cell.hoje { background:var(--destaque); color:var(--destaqueTexto); font-weight:700; }
  .cal-dots { display:flex; gap:2px; position:absolute; bottom:3px; }
  .cal-dot { width:3.5px; height:3.5px; border-radius:50%; }
  .cal-dot-tarefa { width:3.5px; height:3.5px; border-radius:50%; background:var(--azul); }
  .cal-legend { display:flex; gap:12px; margin-top:12px; font-size:8.5px; color:var(--cinzaClaro); flex-wrap:wrap; }
  .cal-legend span { display:flex; align-items:center; gap:4px; }

  .pagamento-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; }
  .pagamento-avatar { width:25px; height:25px; border-radius:8px; background:var(--inputBg); display:grid; place-items:center; font-size:9.5px; font-weight:700; }

  .clientes-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:11px; }
  .client-card { border-radius:18px; padding:18px; transition:all .25s ease; }
  .client-card:hover { transform:translateY(-3px); box-shadow:var(--sombraFlutuante); background:var(--cardHover); }
  .client-avatar { width:36px; height:36px; border-radius:11px; background:var(--bg); display:grid; place-items:center; font-size:13px; font-weight:700; }
  .client-progress-bg { height:6px; background:var(--inputBg); border-radius:10px; margin-top:13px; overflow:hidden; }
  .client-progress-fill { height:100%; border-radius:10px; transition:width .5s cubic-bezier(.16,1,.3,1); background:var(--destaque); }
  .client-progress-fill.completo { background:var(--verde); }
  .status-pill { padding:3px 9px; border-radius:99px; background:var(--inputBg); font-weight:600; }
  .completo-banner { margin-top:14px; background: color-mix(in srgb, var(--verde) 12%, transparent); border-radius:12px; padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; overflow:auto; }
  .modal-box { background:var(--card); border-radius:18px; padding:22px; width:340px; max-width:90vw; max-height:calc(100vh - 40px); box-shadow:var(--sombraFlutuante); display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex:0 0 auto; }
  #modal-body { min-height:0; overflow-y:auto; overscroll-behavior:contain; padding-right:3px; scrollbar-width:thin; }
  #modal-body::-webkit-scrollbar { width:6px; }
  #modal-body::-webkit-scrollbar-thumb { background:var(--divisor); border-radius:99px; }
  .modal-close { background:transparent; border:none; color:var(--cinza); font-size:15px; cursor:pointer; }
  @media(max-width:560px){ .modal-overlay{padding:12px;} .modal-box{width:100%;max-width:100%;max-height:calc(100vh - 24px);padding:18px;} }

  .toast-host { position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:200; pointer-events:none; }
  .toast { background:var(--card); border-radius:12px; padding:11px 15px; font-size:12px; color:var(--texto); box-shadow:var(--sombraFlutuante); display:flex; align-items:center; gap:8px; min-width:190px; animation:slideIn .25s ease; }
  @keyframes slideIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .hist-group-label { font-size:10px; font-weight:700; color:var(--cinzaClaro); letter-spacing:.08em; margin-bottom:8px; text-transform:uppercase; }
  .hist-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:9px 12px; background:var(--card); border-radius:11px; box-shadow:var(--sombraCard); gap:10px; margin-bottom:6px; }
  .hist-left { display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .hist-mid { flex:1; display:flex; justify-content:center; }
  .hist-note-chip { font-size:10.5px; color:var(--texto); background:var(--inputBg); padding:3px 10px; border-radius:7px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist-date-btn { font-family:'Plus Jakarta Sans',sans-serif; color:var(--cinzaClaro); font-size:10px; flex-shrink:0; background:transparent; border:none; cursor:pointer; padding:2px 4px; border-radius:5px; }
  .note-btn { background:transparent; border:none; cursor:pointer; padding:0; margin-left:3px; display:inline-flex; align-items:center; }

  .conclusao-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:10px 13px; background: color-mix(in srgb, var(--verde) 12%, transparent); border-radius:11px; margin-bottom:6px; }


  /* ---------- Financeiro — padrão do painel ---------- */
  .financeiro-card{margin-bottom:12px;overflow:hidden}
  .financeiro-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
  .financeiro-title{font-size:16px;margin:0;letter-spacing:-.035em}
  .financeiro-caption{display:block;margin-top:5px;font-size:9px;color:var(--cinzaClaro)}
  .financeiro-month-nav{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .financeiro-month-name{min-width:106px;text-align:center;font-size:9px;font-weight:700;text-transform:capitalize}
  .financeiro-nav-btn{width:28px;height:28px;border:0;background:var(--inputBg);color:var(--texto);border-radius:9px;cursor:pointer;font-size:13px;transition:transform .18s ease,background .18s ease}
  .financeiro-nav-btn:hover{background:var(--cardHover);transform:translateY(-1px)}
  .financeiro-nav-today{border:0;background:transparent;color:var(--cinza);font-size:8px;cursor:pointer;padding:5px 4px;transition:color .18s ease}
  .financeiro-nav-today:hover{color:var(--texto)}

  .financeiro-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .financeiro-action{height:40px;border:0;background:var(--inputBg);color:var(--texto);border-radius:11px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:9px;font-weight:650;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
  .financeiro-action:hover{background:var(--cardHover);transform:translateY(-2px);box-shadow:0 10px 22px -18px rgba(0,0,0,.8)}
  .financeiro-action strong{font-size:15px;line-height:1;font-weight:450}
  .financeiro-action.primary{background:var(--destaque);color:var(--destaqueTexto);box-shadow:0 10px 24px -18px rgba(255,255,255,.55)}
  .financeiro-action.primary:hover{filter:none;background:var(--destaque);transform:translateY(-2px);box-shadow:0 14px 26px -17px rgba(255,255,255,.7)}

  .financeiro-hero{padding:19px 20px 16px;background:var(--destaque);color:var(--destaqueTexto);border-radius:18px;margin-bottom:10px;box-shadow:var(--sombraCard);transition:transform .2s ease,box-shadow .2s ease}
  .financeiro-hero:hover{transform:translateY(-1px);box-shadow:var(--sombraFlutuante)}
  .financeiro-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  .financeiro-hero-label{font-size:8px;text-transform:uppercase;letter-spacing:.09em;opacity:.52}
  .financeiro-hero-value{display:block;font-size:31px;line-height:1;letter-spacing:-.065em;margin-top:7px}
  .financeiro-hero-note{font-size:8px;opacity:.48;margin-top:8px}
  .financeiro-hero-formula{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}
  .financeiro-formula-chip{font-size:7.5px;color:inherit;background:color-mix(in srgb,var(--destaqueTexto) 7%,transparent);border:0;border-radius:7px;padding:5px 7px;opacity:.82}
  .financeiro-mini-meta{text-align:right;min-width:132px;padding-top:2px}
  .financeiro-mini-meta-label{font-size:7.5px;opacity:.5}

<body data-theme="escuro">
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-host"></div>

<script>
(function () {
  "use strict";

  // ---------- Chaves de armazenamento (localStorage do navegador) ----------
  const K_CLIENTES = "soars-clientes-v3";
  const K_HISTORICO = "soars-historico-v1";
  const K_CONCLUSOES = "soars-conclusoes-v1";
  const K_DESPESAS = "soars-despesas-v1";
  const K_META = "soars-meta-v1";
  const K_TEMA = "soars-tema-v1";
  const K_TAREFAS = "soars-tarefas-v1";
  const K_ANOTACOES = "soars-anotacoes-v1";
  const K_FINANCEIRO = "soars-financeiro-v1";
  const K_FOTO_TOPO = "soars-foto-topo-v1";

  const PALETA_CORES_CLIENTE = ["#BF5AF2", "#FF375F", "#FFD60A"];

  const SEED_CLIENTES = [
    { id: "caio", nome: "Caio", totalVideos: 30, entregues: 19, valorTotal: 1500, diaPagamento: 10, pago: false, dataPagamento: null, notas: "", cor: PALETA_CORES_CLIENTE[0] },
    { id: "joao", nome: "João", totalVideos: 30, entregues: 0, valorTotal: 1950, diaPagamento: 15, pago: false, dataPagamento: null, notas: "", cor: PALETA_CORES_CLIENTE[1] },
  ];

  // ---------- Estado ----------
  let state = {
    clientes: lerJSON(K_CLIENTES, SEED_CLIENTES),
    historico: lerJSON(K_HISTORICO, []),
    conclusoes: lerJSON(K_CONCLUSOES, []),
    despesas: lerJSON(K_DESPESAS, []),
    tarefas: lerJSON(K_TAREFAS, []),
    anotacoes: lerJSON(K_ANOTACOES, []),
    meta: Number(localStorage.getItem(K_META)) || 5000,
    financeiro: lerJSON(K_FINANCEIRO, { metaReserva: 10000, saldoInicial: 0, meses: [], mesSelecionado: null }),
    fotoTopo: localStorage.getItem(K_FOTO_TOPO) || "",
    tema: localStorage.getItem(K_TEMA) || "escuro",
    ultimoSalvo: new Date().toISOString(),
    verTudoHistorico: false,
    verTudoConclusoes: false,
    confirmarReset: false,
    notaHoverId: null,
    calMes: new Date().getMonth(),
    calAno: new Date().getFullYear(),
    producaoSemanaOffset: 0,
  };

  // Migração: clientes salvos antes do sistema de cores e do histórico por pacote/pagamento.
  // O objetivo é preservar o que já existe sem apagar os registros anteriores.
  function garantirEstruturaClientes() {
    let mudou = false;

    function pacoteBase(c, inicio) {
      return {
        id: "pacote-" + uid(),
        inicio: inicio || null,
        fim: null,
        totalVideos: Number(c.totalVideos) || 0,
        entregues: Number(c.entregues) || 0,
        valorTotal: Number(c.valorTotal) || 0,
        status: "em-andamento"
      };
    }

    const historicoOrdenado = [...state.historico].sort((a, b) => new Date(a.quando) - new Date(b.quando));

    state.clientes.forEach((c, i) => {
      if (!c.cor) {
        c.cor = PALETA_CORES_CLIENTE[i % PALETA_CORES_CLIENTE.length];
        mudou = true;
      }

      // Estrutura nova: vários pacotes independentes por cliente.
      if (!Array.isArray(c.pacotes)) {
        const eventosPacote = historicoOrdenado.filter(e =>
          e.clienteNome === c.nome && (e.tipo === "novo-cliente" || e.tipo === "novo-pacote")
        );
        const pacotes = [];
        if (eventosPacote.length) {
          eventosPacote.forEach((e, idx) => {
            const inicio = e.quando || null;
            const p = {
              id: "pacote-" + uid(),
              inicio,
              fim: idx < eventosPacote.length - 1 ? eventosPacote[idx + 1].quando : null,
              totalVideos: Number(c.totalVideos) || 0,
              entregues: idx < eventosPacote.length - 1 ? Number(c.totalVideos) || 0 : Number(c.entregues) || 0,
              valorTotal: Number(c.valorTotal) || 0,
              status: idx < eventosPacote.length - 1 ? "concluido" : ((Number(c.entregues) || 0) >= (Number(c.totalVideos) || 0) ? "concluido" : "em-andamento")
            };
            pacotes.push(p);
          });
        } else {
          pacotes.push(pacoteBase(c, null));
        }
        c.pacotes = pacotes;
        c.pacoteAtualId = c.pacotes[c.pacotes.length - 1].id;
        mudou = true;
      }

      if (!c.pacotes.length) {
        const p = pacoteBase(c, null);
        c.pacotes = [p];
        c.pacoteAtualId = p.id;
        mudou = true;
      }
      if (!c.pacoteAtualId || !c.pacotes.some(p => p.id === c.pacoteAtualId)) {
        c.pacoteAtualId = c.pacotes[c.pacotes.length - 1].id;
        mudou = true;
      }

      // Estrutura nova: vários pagamentos independentes, cada um ligado a um pacote.
      if (!Array.isArray(c.pagamentos)) {
        const eventosPagamento = historicoOrdenado.filter(e =>
          e.clienteNome === c.nome && (e.tipo === "pagamento" || e.tipo === "pagamento-desfeito")
        );
        const pagamentos = [];
        eventosPagamento.forEach(e => {
          if (e.tipo === "pagamento") {
            let pacote = c.pacotes[0];
            for (const p of c.pacotes) {
              if (p.inicio && new Date(p.inicio) <= new Date(e.quando)) pacote = p;
            }
            pagamentos.push({
              id: "pagamento-" + uid(),
              pacoteId: pacote ? pacote.id : c.pacoteAtualId,
              valor: Number(e.valor) || Number(c.valorTotal) || 0,
              data: e.quando,
              desfeito: false
            });
          } else {
            for (let j = pagamentos.length - 1; j >= 0; j--) {
              if (!pagamentos[j].desfeito) {
                pagamentos[j].desfeito = true;
                break;
              }
            }
          }
        });
        c.pagamentos = pagamentos.filter(p => !p.desfeito);
        // Caso antigo tenha o pagamento atual salvo, preserva-o mesmo sem evento no histórico.
        if (c.pago && !c.pagamentos.length) {
          c.pagamentos.push({
            id: "pagamento-" + uid(),
            pacoteId: c.pacoteAtualId,
            valor: Number(c.valorTotal) || 0,
            data: c.dataPagamento || new Date().toISOString(),
            desfeito: false
          });
        }
        mudou = true;
      }

      // O estado antigo continua existindo por compatibilidade, mas agora é derivado do pacote atual.
      const ativosAtual = c.pagamentos.filter(p => !p.desfeito && p.pacoteId === c.pacoteAtualId);
      c.pago = ativosAtual.length > 0;
      c.dataPagamento = ativosAtual.length ? ativosAtual[ativosAtual.length - 1].data : null;
      const atual = c.pacotes.find(p => p.id === c.pacoteAtualId);
      if (atual) {
        atual.totalVideos = Number(c.totalVideos) || atual.totalVideos;
        atual.valorTotal = Number(c.valorTotal) || atual.valorTotal;
        atual.entregues = Number(c.entregues) || 0;
        if (atual.entregues >= atual.totalVideos && atual.totalVideos > 0) atual.status = "concluido";
      }
    });

    if (mudou) salvar(K_CLIENTES, state.clientes);
  }
  garantirEstruturaClientes();

  function lerJSON(chave, padrao) {
    try {
      const v = localStorage.getItem(chave);
      return v ? JSON.parse(v) : padrao;
    } catch (e) { return padrao; }
  }
  function salvar(chave, valor) {
    try {
      localStorage.setItem(chave, typeof valor === "string" ? valor : JSON.stringify(valor));
      state.ultimoSalvo = new Date().toISOString();
      return true;
    } catch (e) { return false; }
  }

  // ---------- Utilitários ----------
  function brl(n) { return (n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function fmtDataHora(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " · " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
  function fmtHora(iso) { return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function nomeMes(d) {
    const s = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function diasAteDia(dia) {
    const hoje = new Date();
    let alvo = new Date(hoje.getFullYear(), hoje.getMonth(), dia);
    if (alvo < hoje) alvo = new Date(hoje.getFullYear(), hoje.getMonth() + 1, dia);
    return Math.ceil((alvo - hoje) / 86400000);
  }
  function statusPagamento(cliente) {
    if (cliente.pago) return { cor: "var(--verde)", texto: "pago" };
    const d = diasAteDia(cliente.diaPagamento);
    if (d <= 0) return { cor: "var(--vermelho)", texto: d < 0 ? "atrasado" : "hoje" };
    if (d === 1) return { cor: "var(--laranja)", texto: "amanhã" };
    if (d === 2) return { cor: "var(--azul)", texto: "em 2d" };
    return { cor: "var(--cinza)", texto: "dia " + cliente.diaPagamento };
  }
  function iniciais(nome) { return nome.trim().slice(0, 1).toUpperCase(); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function uid() { return Date.now() + "-" + Math.random().toString(36).slice(2, 7); }
  function paraInputDatetime(iso) {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function parseDataBR(texto) {
    const m = texto.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    const dia = Number(m[1]), mes = Number(m[2]), ano = Number(m[3]), hora = Number(m[4]), min = Number(m[5]);
    const d = new Date(ano, mes - 1, dia, hora, min);
    if (d.getFullYear() !== ano || d.getMonth() !== mes - 1 || d.getDate() !== dia) return null;

    const d = new Date(ano, mes - 1, dia);
    if (d.getFullYear() !== ano || d.getMonth() !== mes - 1 || d.getDate() !== dia) return null;

  function registrarEntrega(id, delta) {
    const c = encontrarCliente(id); if (!c) return;
    const novoValor = Math.max(0, Math.min(c.totalVideos, c.entregues + delta));
    const realDelta = novoValor - c.entregues;
    if (realDelta === 0) return;
    const eraCompleto = c.entregues >= c.totalVideos;
    c.entregues = novoValor;
    const pacoteAtual = pacoteAtualCliente(c);
    if (pacoteAtual) {
      pacoteAtual.entregues = novoValor;
      pacoteAtual.totalVideos = Number(c.totalVideos) || pacoteAtual.totalVideos;
      pacoteAtual.valorTotal = Number(c.valorTotal) || pacoteAtual.valorTotal;
    }
    salvarClientes();
    registrarEvento({ tipo: "entrega", clienteNome: c.nome, quantidade: realDelta, totalApos: novoValor, pacoteId: pacoteAtual ? pacoteAtual.id : null });
    if (realDelta > 0) toast("+1 vídeo · " + c.nome + " (" + novoValor + "/" + c.totalVideos + ")", "var(--texto)");
    if (!eraCompleto && novoValor === c.totalVideos) {
      const pacoteAtual = pacoteAtualCliente(c);
      if (pacoteAtual) { pacoteAtual.status = "concluido"; pacoteAtual.fim = new Date().toISOString(); }

    render();
  }
  function pacoteAtualCliente(cliente) {

  }
  function pagamentosDoCliente(cliente) {

  }

  function iniciarNovoPacote(id) {

  // ---------- Despesas ----------
  function despesaFixaDoId(id) {
    garantirFinanceiro();

  }
  function chaveMesDaDataISO(iso) {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? null : chaveMesFinanceiro(d.getFullYear(), d.getMonth());
  }
  function dataFixaNoMes(fixa, chave) {
    const [ano, mes] = chave.split('-').map(Number);
    const ultimoDia = new Date(ano, mes, 0).getDate();
    const dia = Math.min(Math.max(Number(fixa.dia) || 1, 1), ultimoDia);
    return new Date(ano, mes - 1, dia, 12, 0, 0).toISOString();
  }
  function mesIgualOuDepois(a, b) {
    return String(a).localeCompare(String(b)) >= 0;
  }
  function garantirEstruturaDespesas() {
    let mudou = false;
    state.despesas.forEach(d => {
      if (!d.dataCompra) { d.dataCompra = d.quando; mudou = true; }
      if (!d.dataPagamento) { d.dataPagamento = d.quando; mudou = true; }
      if (!d.formaPagamento) { d.formaPagamento = 'conta'; mudou = true; }
    });
    garantirFinanceiro();
    state.financeiro.despesasFixas.forEach(f => {
      if (!f.diaCompra) { f.diaCompra = Number(f.dia) || 1; mudou = true; }
      if (!f.diaPagamento) { f.diaPagamento = Number(f.dia) || f.diaCompra || 1; mudou = true; }
      if (!f.formaPagamento) { f.formaPagamento = 'conta'; mudou = true; }
    });
    if (mudou) { salvar(K_DESPESAS, state.despesas); salvarFinanceiro(); }
  }
  garantirEstruturaDespesas();

  function dataPagamentoDaDespesa(d) { return d.dataPagamento || d.quando || null; }
  function dataCompraDaDespesa(d) { return d.dataCompra || d.quando || null; }
  function dataFixaPagamentoNoMes(fixa, chave) {
    const [ano, mes] = chave.split('-').map(Number);
    const ultimoDia = new Date(ano, mes, 0).getDate();
    const dia = Math.min(Math.max(Number(fixa.diaPagamento || fixa.dia) || 1, 1), ultimoDia);
    return new Date(ano, mes - 1, dia, 12, 0, 0).toISOString();
  }
  function dataFixaCompraParaPagamento(fixa, chave) {
    const [ano, mes] = chave.split('-').map(Number);
    const diaCompra = Math.max(Number(fixa.diaCompra || fixa.dia) || 1, 1);
    const diaPagamento = Math.max(Number(fixa.diaPagamento || fixa.dia) || 1, 1);
    const deslocaMes = diaCompra > diaPagamento ? -1 : 0;
    const base = new Date(ano, mes - 1 + deslocaMes, 1);
    const ultimoDia = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
    const dia = Math.min(diaCompra, ultimoDia);
    return new Date(base.getFullYear(), base.getMonth(), dia, 12, 0, 0).toISOString();
  }
  function despesasDoMesFinanceiro(chave) {
    const reais = state.despesas
      .filter(d => pertenceAoMesFinanceiro(dataPagamentoDaDespesa(d), chave))
      .map(d => ({ ...d, origem: 'registro' }));

    garantirFinanceiro();
    const idsComRegistro = new Set(reais.filter(d => d.fixaId).map(d => d.fixaId));
    const virtuais = [];
    state.financeiro.despesasFixas.forEach(f => {
      if (!f.ativo) return;
      if (!mesIgualOuDepois(chave, f.inicio)) return;
      if (idsComRegistro.has(f.id)) return;
      const dataPagamento = dataFixaPagamentoNoMes(f, chave);
      const dataCompra = dataFixaCompraParaPagamento(f, chave);
      virtuais.push({
        id: 'fixa-' + f.id + '-' + chave,
        fixaId: f.id,
        nome: f.nome,
        valor: Number(f.valor) || 0,
        categoria: f.categoria || 'Fixa',
        quando: dataPagamento,
        dataCompra,
        dataPagamento,
        formaPagamento: f.formaPagamento || 'conta',
        fixa: true,
        virtual: true,
        origem: 'recorrente'

    });
    return [...reais, ...virtuais].sort((a,b) => new Date(dataPagamentoDaDespesa(b)) - new Date(dataPagamentoDaDespesa(a)));
  }
  function adicionarDespesa(dados) {
    const compraBase = dados.dataCompra ? new Date(dados.dataCompra + 'T12:00:00') : new Date();
    const pagamentoBase = dados.dataPagamento ? new Date(dados.dataPagamento + 'T12:00:00') : compraBase;
    const dataCompra = Number.isNaN(compraBase.getTime()) ? new Date().toISOString() : compraBase.toISOString();
    const dataPagamento = Number.isNaN(pagamentoBase.getTime()) ? dataCompra : pagamentoBase.toISOString();
    if (dados.fixa) {
      const fixa = {
        id: 'fixa-' + uid(),
        nome: dados.nome.trim(),
        valor: Number(dados.valor) || 0,
        categoria: dados.categoria.trim() || 'Fixa',
        diaCompra: compraBase.getDate(),
        diaPagamento: pagamentoBase.getDate(),
        // Mantém o campo antigo para compatibilidade. Ele representa o dia do pagamento.
        dia: pagamentoBase.getDate(),
        formaPagamento: dados.formaPagamento || 'conta',
        inicio: chaveMesDaDataISO(dataPagamento),
        ativo: true
      };
      garantirFinanceiro();
      state.financeiro.despesasFixas.push(fixa);
      state.despesas.unshift({ id: uid(), fixaId: fixa.id, fixa: true, nome: fixa.nome, valor: fixa.valor, categoria: fixa.categoria, formaPagamento: fixa.formaPagamento, quando: dataPagamento, dataCompra, dataPagamento });
      salvarFinanceiro();

    } else {
      const d = { id: uid(), nome: dados.nome.trim(), valor: Number(dados.valor) || 0, categoria: dados.categoria.trim() || 'Outros', formaPagamento: dados.formaPagamento || 'conta', quando: dataPagamento, dataCompra, dataPagamento };
      state.despesas.unshift(d);

      toast('Despesa \"' + d.nome + '\" adicionada', 'var(--vermelho)');
    }
    render();
  }
  function editarDespesa(id, dados) {

  function editarDespesaFixa(fixaId, dados) {

  function diasAtePrazo(prazoISO) {

    if (!texto.trim()) return;
    state.anotacoes.unshift({ id: uid(), texto: texto.trim(), quando: new Date().toISOString() });
    salvar(K_ANOTACOES, state.anotacoes);
    render();
  }
  function removerAnotacao(id) {
    state.anotacoes = state.anotacoes.filter((a) => a.id !== id);
    salvar(K_ANOTACOES, state.anotacoes);
    render();
  }

  // ---------- Meta ----------
  function salvarMeta(valor) {
    state.meta = valor;
    salvar(K_META, String(valor));
    render();
  }


  // ---------- Financeiro ----------
  function chaveMesFinanceiro(ano, mes) { return String(ano) + "-" + String(mes + 1).padStart(2, "0"); }
  function mesAtualFinanceiro() { const d = new Date(); return chaveMesFinanceiro(d.getFullYear(), d.getMonth()); }
  function garantirFinanceiro() {
    if (!state.financeiro || typeof state.financeiro !== "object") state.financeiro = { metaReserva: 10000, saldoInicial: 0, meses: [], despesasFixas: [], mesSelecionado: null };
    if (!Array.isArray(state.financeiro.meses)) state.financeiro.meses = [];
    if (!Array.isArray(state.financeiro.despesasFixas)) state.financeiro.despesasFixas = [];
    if (!Number.isFinite(Number(state.financeiro.metaReserva)) || Number(state.financeiro.metaReserva) <= 0) state.financeiro.metaReserva = 10000;
    if (!Number.isFinite(Number(state.financeiro.saldoInicial))) state.financeiro.saldoInicial = 0;
    state.financeiro.meses.forEach(m => { m.aportes = Array.isArray(m.aportes) ? m.aportes : []; });
  }
  garantirFinanceiro();
  function salvarFinanceiro() { salvar(K_FINANCEIRO, state.financeiro); }

  // Só cria um mês quando existe uma movimentação financeira real.
  function obterMesFinanceiro(chave, criar) {
    garantirFinanceiro();
    let m = state.financeiro.meses.find(x => x.chave === chave);
    if (!m && criar) {
      const [ano, mes] = chave.split("-").map(Number);
      m = { chave, ano, mes, fechado: false, aportes: [] };
      state.financeiro.meses.push(m);
      state.financeiro.meses.sort((a,b) => a.chave.localeCompare(b.chave));
      salvarFinanceiro();
    }
    if (m) m.aportes = Array.isArray(m.aportes) ? m.aportes : [];
    return m;
  }
  function nomeMesChave(chave) {
    const [ano, mes] = chave.split("-").map(Number);
    const d = new Date(ano, mes - 1, 1);
    const n = d.toLocaleDateString("pt-BR", { month:"long", year:"numeric" });
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  function dataPagamentoCliente(cliente) {
    const pagamento = pagamentoAtualDoCliente(cliente);
    if (pagamento) return pagamento.data;
    if (cliente && cliente.dataPagamento) return cliente.dataPagamento;
    return null;
  }
  function todosPagamentosCliente(cliente) {
    return pagamentosDoCliente(cliente);
  }
  function pagamentosDoMesCliente(cliente, chave) {
    return todosPagamentosCliente(cliente).filter(p => pertenceAoMesFinanceiro(p.data, chave));
  }
  function pagamentoNoMesCliente(cliente, chave) {
    const lista = pagamentosDoMesCliente(cliente, chave).sort((a,b) => new Date(a.data) - new Date(b.data));
    return lista.length ? lista[lista.length - 1] : null;
  }
  function dataPrevistaPagamentoMes(cliente, ano, mesZero) {
    if (!cliente || !Number(cliente.diaPagamento)) return null;
    const ultimoDia = new Date(ano, mesZero + 1, 0).getDate();
    const dia = Math.min(Math.max(Number(cliente.diaPagamento), 1), ultimoDia);
    return new Date(ano, mesZero, dia, 12, 0, 0);
  }
  function pertenceAoMesFinanceiro(iso, chave) {
    if (!iso) return false;
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return false;
    return chaveMesFinanceiro(d.getFullYear(), d.getMonth()) === chave;
  }
  function aportesDoMes(chave) {
    const m = obterMesFinanceiro(chave, false);
    return m ? m.aportes : [];
  }
  function dadosFinanceirosMes(chave) {
    const recebido = state.clientes.reduce((s,c) => s + pagamentosDoMesCliente(c, chave).reduce((a,p) => a + Number(p.valor || 0), 0), 0);
    const despesas = despesasDoMesFinanceiro(chave).reduce((s,d) => s + Number(d.valor || 0), 0);
    const aportes = aportesDoMes(chave).reduce((s,a) => s + Number(a.valor || 0), 0);
    return { recebido, despesas, aportes, liquido: recebido - despesas, disponivel: recebido - despesas - aportes };
  }
  function mesesComMovimentacaoFinanceira() {
    const set = new Set();
    state.clientes.forEach(c => { todosPagamentosCliente(c).forEach(p => { const dt = new Date(p.data); if (!Number.isNaN(dt.getTime())) set.add(chaveMesFinanceiro(dt.getFullYear(), dt.getMonth())); }); });
    state.despesas.forEach(d => { const dt = new Date(dataPagamentoDaDespesa(d)); if (!Number.isNaN(dt.getTime())) set.add(chaveMesFinanceiro(dt.getFullYear(), dt.getMonth())); });
    state.financeiro.meses.forEach(m => { if (m.aportes && m.aportes.length) set.add(m.chave); });
    return [...set].sort((a,b) => b.localeCompare(a));
  }
  function totalReserva() {
    garantirFinanceiro();
    return Number(state.financeiro.saldoInicial || 0) + state.financeiro.meses.reduce((s,m) => s + (m.aportes || []).reduce((a,x) => a + Number(x.valor || 0), 0), 0);
  }
  function salvarAporteFinanceiro(chave, dados, id) {
    const m = obterMesFinanceiro(chave, true);
    if (id) {
      const item = m.aportes.find(x => x.id === id);
      if (item) Object.assign(item, dados);
    } else {
      m.aportes.unshift({ id: uid(), ...dados, criadoEm: new Date().toISOString() });
    }
    salvarFinanceiro();
    toast(id ? "Aporte atualizado" : "Aporte registrado", "var(--verde)");
    render();
  }
  function removerAporteFinanceiro(chave, id) {
    const m = obterMesFinanceiro(chave, false);
    if (!m) return;
    m.aportes = m.aportes.filter(x => x.id !== id);
    if (!m.aportes.length && !m.fechado) state.financeiro.meses = state.financeiro.meses.filter(x => x.chave !== chave);
    salvarFinanceiro();
    render();
  }
  function alternarMesFinanceiro(chave) {
    const m = obterMesFinanceiro(chave, false);
    if (!m) return;
    m.fechado = !m.fechado;
    salvarFinanceiro();
    render();
  }
  function abrirModalAporteFinanceiro(chave, id) {
    const m = obterMesFinanceiro(chave, false);
    const item = id && m ? m.aportes.find(x => x.id === id) : null;
    abrirModal(item ? "Editar aporte" : "Registrar aporte",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<div style="font-size:9px;color:var(--cinzaClaro);">' + esc(nomeMesChave(chave)) + ' · esse valor será descontado automaticamente do disponível.</div>' +
      '<input class="input-field" id="fin-aporte-nome" value="' + esc(item?.nome || "CDB / reserva de emergência") + '" placeholder="onde guardou?">' +
      '<input class="input-field" id="fin-aporte-valor" type="number" step="0.01" value="' + (item?.valor ?? "") + '" placeholder="valor guardado">' +
      '<input class="input-field" id="fin-aporte-data" type="date" value="' + esc(item?.data || (chave + "-01")) + '">' +
      '<textarea class="input-field" id="fin-aporte-obs" style="resize:vertical;min-height:55px;" placeholder="observação (opcional)">' + esc(item?.obs || "") + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:3px;">' +
      '<button class="btn btn-dark" id="fin-aporte-salvar" style="flex:1;">salvar</button>' + (item ? '<button class="btn" id="fin-aporte-remover" style="color:var(--vermelho);">remover</button>' : '') +
      '</div></div>',
      () => {
        document.getElementById("fin-aporte-salvar").addEventListener("click", () => {
          const nome = document.getElementById("fin-aporte-nome").value.trim();
          const valor = Number(document.getElementById("fin-aporte-valor").value);
          if (!nome || !valor || valor < 0) return toast("Preencha onde guardou e o valor", "var(--vermelho)");
          salvarAporteFinanceiro(chave, { nome, valor, data: document.getElementById("fin-aporte-data").value || chave + "-01", obs: document.getElementById("fin-aporte-obs").value.trim() }, id);
          fecharModal();
        });
        if (item) document.getElementById("fin-aporte-remover").addEventListener("click", () => { removerAporteFinanceiro(chave, id); fecharModal(); });
      }
    );
  }
  function abrirModalMetaReserva() {
    abrirModal("Reserva de emergência",
      '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<input class="input-field" id="fin-meta" type="number" step="0.01" value="' + Number(state.financeiro.metaReserva || 10000) + '" placeholder="meta da reserva">' +
      '<input class="input-field" id="fin-saldo" type="number" step="0.01" value="' + Number(state.financeiro.saldoInicial || 0) + '" placeholder="saldo que já existia">' +
      '<div style="font-size:9px;color:var(--cinzaClaro);">O saldo inicial não altera o disponível do mês. Ele apenas define quanto já existia na reserva antes deste controle.</div>' +
      '<button class="btn btn-dark" id="fin-meta-salvar">salvar</button></div>',
      () => document.getElementById("fin-meta-salvar").addEventListener("click", () => {
        state.financeiro.metaReserva = Math.max(0, Number(document.getElementById("fin-meta").value) || 0);
        state.financeiro.saldoInicial = Math.max(0, Number(document.getElementById("fin-saldo").value) || 0);
        salvarFinanceiro(); fecharModal(); render();
      })
    );
  }
  function abrirModalMesFinanceiro(chave) {
    const t = dadosFinanceirosMes(chave), aportes = aportesDoMes(chave), m = obterMesFinanceiro(chave, false);
    abrirModal("Resumo de " + nomeMesChave(chave),
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
      '<div class="financeiro-item"><span>Recebido</span><b class="num" style="color:var(--verde)">' + brl(t.recebido) + '</b></div>' +
      '<div class="financeiro-item"><span>Despesas</span><b class="num" style="color:var(--vermelho)">' + brl(t.despesas) + '</b></div>' +
      '<div class="financeiro-item"><span>Valor líquido</span><b class="num">' + brl(t.liquido) + '</b></div>' +
      '<div class="financeiro-item"><span>Guardado</span><b class="num" style="color:var(--azul)">' + brl(t.aportes) + '</b></div>' +
      '<div class="financeiro-item"><span>Disponível</span><b class="num" style="color:' + (t.disponivel >= 0 ? 'var(--texto)' : 'var(--vermelho)') + '">' + brl(t.disponivel) + '</b></div>' +
      (m ? '<button class="btn" id="fin-check" style="margin-top:4px;">' + (m.fechado ? '✓ mês conferido' : 'marcar mês como conferido') + '</button>' : '') +
      '</div>',
      () => { const b = document.getElementById("fin-check"); if (b) b.addEventListener("click", () => { alternarMesFinanceiro(chave); fecharModal(); }); }
    );
  }
  function abrirModalMetaFinanceiroMes(chave) {
    abrirModal("Meta de receita · " + nomeMesChave(chave),
      '<div style="display:flex;flex-direction:column;gap:9px;"><div style="font-size:9px;color:var(--cinzaClaro);">Defina quanto você quer receber neste mês. A meta é independente da reserva.</div><input class="input-field" id="fin-meta-receita-local" type="number" step="0.01" value="' + Number(state.meta || 0) + '" placeholder="meta de receita"><button class="btn btn-dark" id="fin-meta-receita-local-salvar">salvar meta</button></div>',
      () => document.getElementById("fin-meta-receita-local-salvar").addEventListener("click", () => { salvarMeta(Math.max(0, Number(document.getElementById("fin-meta-receita-local").value) || 0)); fecharModal(); })
    );
  }
  function abrirModalFinanceiroDetalhe(tipo, chave) {
    const t = dadosFinanceirosMes(chave);
    const recebimentos = [];
    state.clientes.forEach(c => { pagamentosDoMesCliente(c, chave).forEach(p => recebimentos.push({ cliente: c, pagamento: p })); });
    const despesas = despesasDoMesFinanceiro(chave);
    const aportes = aportesDoMes(chave);
    let titulo = "Detalhes · " + nomeMesChave(chave), corpo = '';
    if (tipo === "recebido") {
      titulo = "Recebimentos · " + nomeMesChave(chave);
      corpo = '<div style="display:flex;flex-direction:column;gap:4px;">' + (recebimentos.length ? recebimentos.map(r => '<div class="financeiro-item"><span class="financeiro-item-dot" style="background:var(--verde)"></span><div class="financeiro-item-info"><div class="financeiro-item-nome">' + esc(r.cliente.nome) + '</div><div class="financeiro-item-sub">Recebido em ' + new Date(r.pagamento.data).toLocaleDateString('pt-BR') + '</div></div><strong class="num financeiro-item-value" style="color:var(--verde)">+ ' + brl(r.pagamento.valor) + '</strong></div>').join('') : '<div class="financeiro-empty">Nenhum recebimento neste mês.</div>') + '</div>';
    } else if (tipo === "despesas") {
      titulo = "Despesas · " + nomeMesChave(chave);
      corpo = '<div style="display:flex;flex-direction:column;gap:4px;">' + (despesas.length ? despesas.map(d => '<div class="financeiro-item acao-editar-despesa" data-id="' + esc(d.id) + '" data-fixa-id="' + esc(d.fixaId || '') + '" data-virtual="' + (d.virtual ? '1' : '0') + '"><span class="financeiro-item-dot" style="background:var(--vermelho)"></span><div class="financeiro-item-info"><div class="financeiro-item-nome">' + esc(d.nome) + '</div><div class="financeiro-item-sub">' + esc(d.categoria || "Outros") + (d.virtual ? ' · fixa · prevista' : d.fixa ? ' · fixa' : '') + (d.formaPagamento === 'cartao' ? ' · cartão · compra ' + new Date(dataCompraDaDespesa(d)).toLocaleDateString('pt-BR') + ' · paga ' + new Date(dataPagamentoDaDespesa(d)).toLocaleDateString('pt-BR') : ' · paga ' + new Date(dataPagamentoDaDespesa(d)).toLocaleDateString('pt-BR')) + '</div></div><strong class="num financeiro-item-value" style="color:var(--vermelho)">− ' + brl(d.valor) + '</strong></div>').join('') : '<div class="financeiro-empty">Nenhuma despesa neste mês.</div>') + '<div style="border-top:1px solid var(--borda);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;font-size:10px;"><span>Total</span><b class="num" style="color:var(--vermelho)">' + brl(t.despesas) + '</b></div></div>';
    } else if (tipo === "liquido") {
      titulo = "Resumo · " + nomeMesChave(chave);
      corpo = '<div style="display:flex;flex-direction:column;gap:8px;"><div class="financeiro-item"><span>Recebido</span><b class="num" style="color:var(--verde)">' + brl(t.recebido) + '</b></div><div class="financeiro-item"><span>Despesas</span><b class="num" style="color:var(--vermelho)">− ' + brl(t.despesas) + '</b></div><div class="financeiro-item" style="background:var(--inputBg)"><span><b>Valor líquido</b></span><b class="num">' + brl(t.liquido) + '</b></div></div>';
    } else {

      const mov = [...recebimentos.map(r=>({nome:r.cliente.nome,detalhe:'Recebimento',valor:r.pagamento.valor,data:r.pagamento.data,cor:'var(--verde)'})), ...despesas.map(d=>({nome:d.nome,detalhe:d.categoria||'Despesa',valor:d.valor,data:dataPagamentoDaDespesa(d),cor:'var(--vermelho)'})), ...aportes.map(a=>({nome:a.nome,detalhe:'Aporte',valor:a.valor,data:a.data,cor:'var(--azul)'}))].sort((a,b)=>new Date(b.data||0)-new Date(a.data||0));
      corpo = '<div style="display:flex;flex-direction:column;gap:3px;">' + (mov.length ? mov.map(x=>'<div class="financeiro-item"><span class="financeiro-item-dot" style="background:' + x.cor + '"></span><div class="financeiro-item-info"><div class="financeiro-item-nome">' + esc(x.nome) + '</div><div class="financeiro-item-sub">' + esc(x.detalhe) + ' · ' + new Date(x.data).toLocaleDateString('pt-BR') + '</div></div><strong class="num financeiro-item-value" style="color:' + x.cor + '">' + (x.cor==='var(--verde)'?'+ ':'− ') + brl(x.valor) + '</strong></div>').join('') : '<div class="financeiro-empty">Nenhuma movimentação neste mês.</div>') + '</div>';
    }
    abrirModal(titulo, corpo, () => {
      document.querySelectorAll('#modal-body .acao-editar-despesa').forEach(el => el.addEventListener('click', () => { abrirModalDespesa(null, el.dataset.id); }));
    });
  }

  function renderFinanceiro() {
    garantirFinanceiro();
    const chave = state.financeiro.mesSelecionado || mesAtualFinanceiro();
    const t = dadosFinanceirosMes(chave);
    const reserva = totalReserva();
    const metaReserva = Number(state.financeiro.metaReserva || 0);
    const pctReserva = metaReserva > 0 ? Math.min(Math.round((reserva / metaReserva) * 100), 100) : 0;
    // A meta de receita é automática: corresponde à receita prevista dos clientes ativos.
    // Não é necessário preencher a mesma informação manualmente em outro lugar.
    const metaReceita = state.clientes.reduce((s, c) => s + Number(c.valorTotal || 0), 0);
    const pctReceita = metaReceita > 0 ? Math.min(Math.round((t.recebido / metaReceita) * 100), 100) : 0;
    const despesasMes = despesasDoMesFinanceiro(chave);
    const movimentos = [
      ...state.clientes.flatMap(c => pagamentosDoMesCliente(c, chave).map(p => ({tipo:"recebido",nome:c.nome,detalhe:"Pagamento recebido",valor:p.valor,data:p.data,cor:"var(--verde)",pacoteId:p.pacoteId}))),
      ...despesasMes.map(d => ({tipo:"despesa",nome:d.nome,detalhe:d.categoria || "Despesa",valor:d.valor,data:dataPagamentoDaDespesa(d),cor:"var(--vermelho)",id:d.id,fixaId:d.fixaId,fixa:d.fixa,virtual:d.virtual})),
      ...aportesDoMes(chave).map(a => ({tipo:"aporte",nome:a.nome,detalhe:"Reserva / investimento",valor:a.valor,data:a.data,cor:"var(--azul)",id:a.id}))
    ].sort((a,b) => new Date(b.data || 0) - new Date(a.data || 0));
    const ultimos = movimentos.slice(0,5);
    const meses = mesesComMovimentacaoFinanceira();
    const raio=37, circ=2*Math.PI*raio, offset=circ-(circ*pctReserva/100);

    const base = Math.max(t.recebido, 0);
    const pctDespesaVisual = base > 0 ? Math.min((t.despesas / base) * 100, 100) : 0;
    const pctAporteVisual = base > 0 ? Math.min((t.aportes / base) * 100, Math.max(0, 100 - pctDespesaVisual)) : 0;
    const pctDisponivelVisual = base > 0 ? Math.max(0, 100 - pctDespesaVisual - pctAporteVisual) : 0;

    let h='<section class="card financeiro-card" id="financeiro">';
    h+='<div class="financeiro-top"><div><h2 class="heading financeiro-title">Financeiro</h2><span class="financeiro-caption">Tudo sobre o seu dinheiro, em um só lugar.</span></div>';
    h+='<div class="financeiro-month-nav"><button class="financeiro-nav-btn" id="fin-mes-ant" aria-label="Mês anterior">‹</button><span class="financeiro-month-name">'+esc(nomeMesChave(chave))+'</span><button class="financeiro-nav-btn" id="fin-mes-prox" aria-label="Próximo mês">›</button><button class="financeiro-nav-today" id="fin-mes-hoje">hoje</button></div></div>';

    h+='<div class="financeiro-actions">';
    h+='<button class="financeiro-action" id="fin-acao-despesa"><strong>＋</strong> adicionar despesa</button>';
    h+='<button class="financeiro-action primary" id="fin-acao-aporte"><strong>＋</strong> guardar dinheiro</button>';
    h+='<button class="financeiro-action" id="fin-acao-receita"><strong>↗</strong> ver recebimentos</button>';
    h+='</div>';

    const saldo = t.disponivel;
    h+='<div class="financeiro-hero"><div class="financeiro-hero-top"><div><span class="financeiro-hero-label">Saldo disponível para gastar</span><strong class="num financeiro-hero-value" style="color:'+(saldo>=0?'var(--destaqueTexto)':'var(--vermelho)')+'">'+brl(saldo)+'</strong><div class="financeiro-hero-note">Recebido − despesas − valores guardados</div><div class="financeiro-hero-formula"><span class="financeiro-formula-chip">Recebido '+brl(t.recebido)+'</span><span class="financeiro-formula-chip">− Despesas '+brl(t.despesas)+'</span><span class="financeiro-formula-chip">− Guardado '+brl(t.aportes)+'</span></div></div>';
    h+='<div class="financeiro-mini-meta"><span class="financeiro-mini-meta-label">Meta de receita</span><strong class="num financeiro-mini-meta-value">'+brl(t.recebido)+' <span style="opacity:.5">/</span> '+brl(metaReceita)+'</strong><div class="financeiro-mini-bar"><div class="financeiro-mini-fill" style="width:'+pctReceita+'%"></div></div><span class="financeiro-mini-meta-note">baseada nos clientes ativos</span></div></div></div>';

    h+='<div class="financeiro-summary">';
    h+='<div class="financeiro-summary-item" data-fin-detail="recebido"><span class="financeiro-summary-label">Recebido</span><strong class="num financeiro-summary-value" style="color:var(--verde)">'+brl(t.recebido)+'</strong><span class="financeiro-summary-note">ver detalhes</span></div>';
    h+='<div class="financeiro-summary-item" data-fin-detail="despesas"><span class="financeiro-summary-label">Despesas</span><strong class="num financeiro-summary-value" style="color:var(--vermelho)">'+brl(t.despesas)+'</strong><span class="financeiro-summary-note">ver despesas</span></div>';
    h+='<div class="financeiro-summary-item" data-fin-detail="liquido"><span class="financeiro-summary-label">Líquido</span><strong class="num financeiro-summary-value">'+brl(t.liquido)+'</strong><span class="financeiro-summary-note">antes de guardar</span></div>';
    h+='</div>';

    h+='<div class="financeiro-grid">';
    h+='<div class="financeiro-column">';

  // ---------- Backup / Relatório ----------
  function baixarArquivo(nome, conteudo, tipo) {
    const blob = new Blob([conteudo], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function baixarBackup() {
    const dados = { clientes: state.clientes, historico: state.historico, conclusoes: state.conclusoes, despesas: state.despesas, tarefas: state.tarefas, anotacoes: state.anotacoes, meta: state.meta, financeiro: state.financeiro, tema: state.tema, versao: 4, exportadoEm: new Date().toISOString() };
    baixarArquivo("backup-soars-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(dados, null, 2), "application/json");
    toast("Backup baixado", "var(--texto)");
  }
  function importarBackup(arquivo) {
    const leitor = new FileReader();
    leitor.onload = (ev) => {
      try {
        const dados = JSON.parse(ev.target.result);
        if (dados.clientes) { state.clientes = dados.clientes; salvar(K_CLIENTES, state.clientes); }
        if (dados.historico) { state.historico = dados.historico; salvar(K_HISTORICO, state.historico); }
        if (dados.conclusoes) { state.conclusoes = dados.conclusoes; salvar(K_CONCLUSOES, state.conclusoes); }
        if (dados.despesas) { state.despesas = dados.despesas; salvar(K_DESPESAS, state.despesas); }
        if (dados.tarefas) { state.tarefas = dados.tarefas; salvar(K_TAREFAS, state.tarefas); }
        if (dados.anotacoes) { state.anotacoes = dados.anotacoes; salvar(K_ANOTACOES, state.anotacoes); }
        if (typeof dados.fotoTopo === "string") { state.fotoTopo = dados.fotoTopo; salvar(K_FOTO_TOPO, state.fotoTopo); }
        garantirEstruturaClientes();
        if (dados.financeiro) { state.financeiro = dados.financeiro; garantirFinanceiro(); salvarFinanceiro(); }
        if (typeof dados.meta === "number") { state.meta = dados.meta; salvar(K_META, String(dados.meta)); }
        toast("Backup importado com sucesso", "var(--verde)");
        render();
      } catch (e) { toast("Arquivo inválido — não foi possível importar", "var(--vermelho)"); }
    };
    leitor.readAsText(arquivo);
  }
  function exportarRelatorio() {
    const receitaMensal = state.clientes.reduce((s, c) => s + c.valorTotal, 0);
    const recebido = state.clientes.filter((c) => c.pago).reduce((s, c) => s + c.valorTotal, 0);
    const aReceber = receitaMensal - recebido;
    const totalEntregues = state.clientes.reduce((s, c) => s + c.entregues, 0);
    const totalVideos = state.clientes.reduce((s, c) => s + c.totalVideos, 0);
    const hoje = new Date().toLocaleDateString("pt-BR");
    let txt = "RELATÓRIO — soars.mp4\nGerado em " + hoje + "\n\n";
    txt += "Receita mensal: " + brl(receitaMensal) + "\nDespesas: " + brl(totalDespesas) + "\nLucro líquido: " + brl(lucroLiquido) + "\nRecebido: " + brl(recebido) + "\nA receber: " + brl(aReceber) + "\nProdução: " + totalEntregues + "/" + totalVideos + " vídeos\n\n";
    txt += "CLIENTES\n";
    state.clientes.forEach((c) => {
      txt += "- " + c.nome + ": " + c.entregues + "/" + c.totalVideos + " vídeos · " + brl(c.valorTotal) + " · dia " + c.diaPagamento + " · " + (c.pago ? "pago" : "pendente") + "\n";
      if (c.notas) txt += "  obs: " + c.notas + "\n";
    });
    txt += "\nPACOTES CONCLUÍDOS\n";
    state.conclusoes.slice(0, 30).forEach((cn) => { txt += "- " + fmtDataHora(cn.quando) + " · " + cn.clienteNome + " · " + cn.quantidade + " vídeos · " + brl(cn.valor) + "\n"; });
    txt += "\nHISTÓRICO RECENTE\n";
    state.historico.slice(0, 30).forEach((ev) => { txt += "- " + fmtDataHora(ev.quando) + " · " + ev.clienteNome + " · " + ev.tipo + (ev.quantidade ? " (" + (ev.quantidade > 0 ? "+" : "") + ev.quantidade + ")" : "") + "\n"; });
    baixarArquivo("relatorio-soars-" + hoje.replace(/\//g, "-") + ".txt", txt, "text/plain;charset=utf-8");
    toast("Relatório exportado", "var(--texto)");
  }

  // ---------- Foto de topo ----------
  function processarFotoTopo(arquivo) {
    if (!arquivo || !arquivo.type || !arquivo.type.startsWith("image/")) {
      toast("Escolha uma imagem", "var(--vermelho)");
      return;
    }

    const leitor = new FileReader();
    leitor.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        try {
          const maxLado = 1800;
          const escala = Math.min(1, maxLado / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
          const largura = Math.max(1, Math.round((img.naturalWidth || img.width) * escala));
          const altura = Math.max(1, Math.round((img.naturalHeight || img.height) * escala));
          const canvas = document.createElement("canvas");
          canvas.width = largura;
          canvas.height = altura;
          const ctx = canvas.getContext("2d");
          if (!ctx) throw new Error("canvas indisponível");
          ctx.drawImage(img, 0, 0, largura, altura);

          let dataURL = canvas.toDataURL("image/webp", 0.82);
          if (!dataURL.startsWith("data:image/webp")) dataURL = canvas.toDataURL("image/jpeg", 0.82);

          const ok = salvar(K_FOTO_TOPO, dataURL);
          if (!ok) {
            toast("A foto é grande demais para o armazenamento do navegador", "var(--vermelho)");
            return;
          }
          state.fotoTopo = dataURL;
          toast("Foto adicionada", "var(--verde)");
          render();
        } catch (e) {
          toast("Não foi possível preparar a foto", "var(--vermelho)");
        }
      };
      img.onerror = () => toast("Imagem inválida", "var(--vermelho)");
      img.src = ev.target.result;
    };
    leitor.onerror = () => toast("Não foi possível ler a foto", "var(--vermelho)");
    leitor.readAsDataURL(arquivo);
  }

    state.fotoTopo = "";
    localStorage.removeItem(K_FOTO_TOPO);
    toast("Foto removida", "var(--texto)");
    render();
  }
